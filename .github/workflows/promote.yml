# "Canlıya al": test (staging) dalında denenmiş her şeyi canlıya (main) taşır.
# Taşınan APK, test sunucusunda denenenin AYNISIDIR (yeniden derlenmez); main'e girince Dokploy canlı sunucuyu
# günceller, kutular yeni APK'yı menüden/bildirimle alır. Google Play'e DOKUNMAZ: Play için ayrı "Play'e gönder" (play.yml).
# Çalıştırma: GitHub → Actions → "Canlıya al" → Run workflow → onay kutusuna  canliya-al  yazın.
name: Canlıya al

on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'Onaylamak için canliya-al yazın'
        required: true

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Onay
        env:
          ONAY: ${{ github.event.inputs.onay }}
        run: '[ "$ONAY" = "canliya-al" ] || { echo "::error::Onay metni yanlış (canliya-al yazın)"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: staging'i main'e birleştir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          if git merge-base --is-ancestor origin/staging HEAD; then echo "Canlı zaten güncel."; exit 0; fi
          # APK ve sürüm dosyası iki dalda da CI tarafından yazıldığı için çakışır: test edilen (staging) sürüm alınır
          git merge origin/staging -X theirs --no-edit -m "Canlıya alındı (staging → main)" || {
            for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" && git add "$f"; done
            git commit --no-edit -m "Canlıya alındı (staging → main)"
          }
          # birleşme sonrası kalan çakışma işareti kalmadığından emin ol
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- server public android .github >/dev/null 2>&1; then echo "::error::Çakışma işareti kaldı"; exit 1; fi
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase -q origin main; sleep 5; done
          # üç deneme de reddedildiyse döngü başarılı biter: canlının gerçekten bu koda geçtiğini doğrula
          git fetch -q origin main
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "::error::main'e gönderilemedi; canlı güncellenmedi"; exit 1; }

      # Canlıdaki koda göre Google Play'e gönderilmeyi bekleyen uygulama (android/) değişikliği var mı: son "play-*" etiketinden beri
      - name: Google Play güncellemesi gerekiyor mu
        run: |
          git fetch -q origin main --tags
          LAST=$(git tag -l 'play-*' --sort=-v:refname | head -1)
          [ -n "$LAST" ] || { echo "::notice::Henüz işaretlenmiş Play gönderimi yok (play-* etiketi)."; exit 0; }
          N=$(git rev-list --no-merges --count "$LAST"..origin/main -- android/)
          if [ "$N" -eq 0 ]; then echo "::notice::Google Play güncellemesi GEREKMİYOR: son Play gönderiminden ($LAST) beri uygulama kodu değişmedi."; exit 0; fi
          LIST=$(git log --no-merges --format='• %s' "$LAST"..origin/main -- android/ | head -8 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning::Google Play güncellemesi GEREKİYOR: son Play gönderiminden ($LAST) beri uygulama kodunda $N değişiklik var; hazır olunca \"play'e gönder\" deyin.%0A$LIST"
