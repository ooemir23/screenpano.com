<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Koyu dış arka plan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a1a"/>
      <stop offset="100%" stop-color="#0e1010"/>
    </linearGradient>

    <!-- TV ekranı koyu mat gövdesi -->
    <linearGradient id="tvBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3031"/>
      <stop offset="100%" stop-color="#181b1c"/>
    </linearGradient>

    <!-- Altın / Bronz Çerçeve ve Vurgu Gradyanı -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C878"/>
      <stop offset="40%" stop-color="#DE9640"/>
      <stop offset="80%" stop-color="#B86C20"/>
      <stop offset="100%" stop-color="#8F4E10"/>
    </linearGradient>

    <!-- Sağ üst kart gradyanı -->
    <linearGradient id="cardOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA64D"/>
      <stop offset="100%" stop-color="#BA6F20"/>
    </linearGradient>

    <!-- Sol panel koyu zemin -->
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a1a"/>
      <stop offset="100%" stop-color="#101212"/>
    </linearGradient>

    <!-- Kart gölgeleri -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Yeşil LED ışığı -->
    <filter id="greenLedGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dış Squircle Arka Plan -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- TV Alt Stand Ayakları -->
  <path d="M 218 360 L 192 416" stroke="url(#goldStroke)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 294 360 L 320 416" stroke="url(#goldStroke)" stroke-width="8" stroke-linecap="round"/>

  <!-- TV Ekran Kasası (Yuvarlak hatlı, altın konturlu) -->
  <rect x="86" y="92" width="340" height="268" rx="42" fill="url(#tvBodyGrad)" stroke="url(#goldStroke)" stroke-width="8.5" filter="url(#cardShadow)"/>

  <!-- Üst Orta Yeşil Canlı Yayın LED'i -->
  <circle cx="256" cy="112" r="5" fill="#4ADE80" filter="url(#greenLedGlow)"/>

  <!-- 1. SOL BÜYÜK KART: VİDEO / MEDYA EKRANI -->
  <rect x="114" y="128" width="176" height="196" rx="22" fill="url(#panelDark)" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" filter="url(#cardShadow)"/>
  
  <!-- Ortadaki Net Altın/Bronz PLAY Butonu Üçgeni (Asla kahve yok!) -->
  <polygon points="190,202 190,250 234,226" fill="url(#goldStroke)"/>

  <!-- 2. SAĞ ÜST KART: ANLIK BİLGİ / HAVA / DUYURU -->
  <rect x="304" y="128" width="98" height="90" rx="18" fill="url(#cardOrangeGrad)" filter="url(#cardShadow)"/>
  <!-- Koyu yatay bilgi çizgileri -->
  <line x1="322" y1="156" x2="384" y2="156" stroke="#1c1f20" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="322" y1="175" x2="368" y2="175" stroke="#1c1f20" stroke-width="6" stroke-linecap="round"/>

  <!-- 3. SAĞ ALT KART: LİSTE / MENÜ / FİYAT / BİLGİ -->
  <rect x="304" y="232" width="98" height="92" rx="18" fill="url(#panelDark)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" filter="url(#cardShadow)"/>
  <!-- 1. Satır: Altın nokta + Beyaz çizgi -->
  <circle cx="326" cy="260" r="5" fill="url(#goldStroke)"/>
  <line x1="342" y1="260" x2="384" y2="260" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
  <!-- 2. Satır: Altın nokta + Beyaz çizgi -->
  <circle cx="326" cy="292" r="5" fill="url(#goldStroke)"/>
  <line x1="342" y1="292" x2="380" y2="292" stroke="#F1F5F9" stroke-width="5" stroke-linecap="round"/>
</svg>