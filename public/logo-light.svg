<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97A2B"/>
      <stop offset="100%" stop-color="#8F4800"/>
    </linearGradient>

    <linearGradient id="cardOrangeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5984A"/>
      <stop offset="100%" stop-color="#A55E1A"/>
    </linearGradient>
  </defs>

  <!-- İKON BÖLÜMÜ -->
  <g transform="translate(15, 14)">
    <!-- TV Ayakları -->
    <path d="M 68 122 L 56 142" stroke="#8F4800" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 94 122 L 106 142" stroke="#8F4800" stroke-width="3.5" stroke-linecap="round"/>

    <!-- TV Ekran Kasası -->
    <rect x="12" y="16" width="138" height="106" rx="18" fill="#F8F6F0" stroke="#8F4800" stroke-width="4.5"/>

    <!-- Yeşil LED -->
    <circle cx="81" cy="24" r="2.5" fill="#16A34A"/>

    <!-- 1. Sol Büyük Kart: Video / Medya Alanı -->
    <rect x="23" y="30" width="70" height="78" rx="9" fill="#EDE9DF" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <!-- Play Üçgeni (Sıfır kahve!) -->
    <polygon points="53,60 53,78 70,69" fill="url(#goldLight)"/>

    <!-- 2. Sağ Üst Kart: Turuncu / Karamel Bilgi -->
    <rect x="98" y="30" width="40" height="36" rx="7" fill="url(#cardOrangeLight)"/>
    <line x1="105" y1="42" x2="131" y2="42" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="105" y1="50" x2="124" y2="50" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

    <!-- 3. Sağ Alt Kart: Liste / Pano -->
    <rect x="98" y="71" width="40" height="37" rx="7" fill="#EDE9DF" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <circle cx="106" cy="82" r="2.2" fill="url(#goldLight)"/>
    <line x1="113" y1="82" x2="131" y2="82" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="106" cy="94" r="2.2" fill="url(#goldLight)"/>
    <line x1="113" y1="94" x2="128" y2="94" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- YAZI BÖLÜMÜ -->
  <g transform="translate(195, 0)">
    <text x="0" y="102" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="500" font-size="62" letter-spacing="-1px" fill="#181A1A">
      screen
    </text>

    <text x="218" y="102" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="62" letter-spacing="-0.5px" fill="url(#goldLight)">
      pano
    </text>

    <circle cx="410" cy="94" r="5" fill="#16A34A"/>

    <text x="2" y="134" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="700" font-size="12.5" letter-spacing="5px" fill="#64748B" text-transform="uppercase">
      DİJİTAL EKRAN &amp; PANO YÖNETİMİ
    </text>
  </g>
</svg>