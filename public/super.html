<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><script src="/i18n.js"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="stylesheet" href="/tokens.css">
<title>ScreenPano — Süper Yönetim</title>
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/montserrat-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/montserrat-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC}
*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 12px;background:var(--panel);border-right:1px solid var(--line)}
#side .brand{display:flex;flex-direction:column;gap:6px;padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
#side .brand small{color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);color:var(--text);text-decoration:none;font-size:14px;font-weight:500;opacity:.8}
.nav a i{font-style:normal;width:20px;text-align:center}
.nav a:hover{background:rgba(255,255,255,.05);opacity:1}
.nav a.on{background:linear-gradient(135deg,rgba(var(--a2),.22),rgba(var(--a2),.08));opacity:1;box-shadow:inset 0 0 0 1px rgba(var(--a2),.35)}
.nav a .n{margin-left:auto;background:var(--bad);color:#fff;border-radius:var(--r-m);font-size:12px;font-weight:700;padding:1px 7px}
.sidefoot{display:flex;flex-direction:column;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line);font-size:13px}
.sidefoot a{color:var(--mute);text-decoration:none}.sidefoot a:hover{color:var(--text)}
main{padding:28px 32px 80px;max-width:1380px;width:100%}
h1{font-size:24px;margin-bottom:6px}
h2{font-size:16px;margin-bottom:12px}
h3{font-size:14px;margin:16px 0 8px}
.sub{color:var(--mute);font-size:13.5px;line-height:1.5;margin-bottom:20px;max-width:760px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.stat b{display:block;font-size:26px;color:var(--text);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);line-height:1.5;display:block;margin-top:2px}
.stat .dl{font-size:12px;font-weight:700;display:inline}.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;margin-bottom:20px}
.card>h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--mute);font-size:13px;line-height:1.55;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}tbody tr:hover td{background:rgba(255,255,255,.025)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:var(--r-m);font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:rgba(62,207,74,.15);color:var(--ok)}.tag.trial{background:rgba(201,149,92,.18);color:var(--accent2)}.tag.bad{background:rgba(238,91,79,.15);color:var(--bad)}.tag.warn{background:rgba(233,180,76,.16);color:var(--warn)}.tag.mute{background:rgba(255,255,255,.07);color:var(--mute)}
input,select,textarea{background:#141616;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.row>div{flex:1;min-width:160px}
.row:last-child{margin-bottom:0}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px}
.btn{background:linear-gradient(135deg,var(--accent2),var(--accent));border:0;border-radius:var(--r-s);padding:9px 16px;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap;text-decoration:none;display:inline-block;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.ghost:hover{border-color:var(--accent2)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.danger{background:transparent;border:1px solid rgba(238,91,79,.45);color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cardfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-pill);background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px;user-select:none}
.chip:hover{border-color:var(--accent2)}.chip.on{background:rgba(var(--a2),.22);border-color:var(--accent2)}
.chip b{font-weight:700;color:var(--mute);font-size:12px}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:4px;gap:2px}
.tabs button{background:none;border:0;border-radius:var(--r-s);padding:7px 16px;cursor:pointer;color:var(--mute);font-weight:600;font-size:13px}.tabs button.on{background:var(--panel2);color:var(--text)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar .grow{flex:1;min-width:200px}
.toolbar select{width:auto}
.scroll{overflow-x:auto}
.att{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--panel2);border-radius:var(--r-m);margin-bottom:8px;border-left:3px solid var(--warn)}
.att.bad{border-left-color:var(--bad)}.att.ok{border-left-color:var(--ok)}
.att .b{flex:1;min-width:0;font-size:13.5px;line-height:1.5}.att .b span{color:var(--mute);display:block;font-size:12.5px}
.bar{height:8px;border-radius:var(--r-s);background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0}
.bkbox{margin-top:12px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-m);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.bars div{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--accent2);border-radius:3px 3px 0 0;min-height:2px}.bars div:hover i{background:var(--text)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.it{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--panel2);border-radius:var(--r-m);margin-bottom:8px}
.it .b{flex:1;min-width:0}.it .b span{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.mini{display:flex;align-items:flex-end;gap:2px;height:38px;width:34%;min-width:90px;flex:none}.mini div{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}.mini i{display:block;width:100%;background:var(--accent2);border-radius:2px 2px 0 0;min-height:2px}
.big{font-size:24px;font-weight:700;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:38px repeat(24,1fr);gap:3px;align-items:center}.heat i{display:block;height:22px;border-radius:4px}.heat .hl{font-size:12px;color:var(--mute);text-align:center}.heat .dn{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:26px 10px;font-size:13.5px}
#drawer{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;overflow:hidden}
#drawer.on{display:flex}
#drawer .bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);cursor:pointer}
#drawer .pane{position:relative;z-index:2;width:min(1240px,96vw);max-height:92vh;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-l);box-shadow:0 25px 75px rgba(0,0,0,.8);display:flex;flex-direction:column;overflow:hidden;padding:0;animation:modalIn .18s cubic-bezier(.16,1,.3,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.m-head{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;flex-shrink:0}
.m-body{flex:1;overflow-y:auto;padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:18px;background:var(--bg)}
.m-col{display:flex;flex-direction:column;gap:14px}
.m-foot{padding:14px 24px;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.modal-x{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mute);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .15s}
.modal-x:hover{color:var(--text);background:rgba(255,255,255,.15);border-color:var(--soft)}
.check-box-label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-m);background:var(--panel);border:1px solid var(--line);cursor:pointer;margin-bottom:8px;font-size:13px;transition:border-color .15s}
.check-box-label:hover{border-color:var(--accent2)}
.check-box-label input[type=checkbox]{margin-top:3px}
.kpi-ribbon{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;transition:all .15s;user-select:none;position:relative}
.kpi-card:hover{border-color:var(--accent2);transform:translateY(-1px);background:var(--panel2)}
.kpi-card.on{border-color:var(--accent2);background:rgba(var(--a2),.15);box-shadow:inset 0 0 0 1px var(--accent2)}
.kpi-card b{display:block;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi-card span{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.kpi-card .kic{position:absolute;top:12px;right:12px;width:18px;height:18px;color:var(--mute);opacity:.6}
.search-wrap{position:relative;flex:1;min-width:260px;display:flex;align-items:center}
.search-wrap input{padding-inline-start:36px;padding-inline-end:32px;border-radius:var(--r-m)}
.search-wrap .s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);width:16px;height:16px;pointer-events:none}
.search-wrap .clr-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1}
.search-wrap .clr-btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.badge-count{font-size:13px;color:var(--mute);white-space:nowrap;padding:4px 0}
.badge-count b{color:var(--text)}
.d-card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin-bottom:0}
.d-card h4{font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.d-card h4 .ic{width:16px;height:16px;color:var(--accent2)}
.quick-date-btn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:var(--r-s);padding:4px 9px;font-size:11.5px;color:var(--soft);cursor:pointer;transition:all .15s}
.quick-date-btn:hover{border-color:var(--accent2);color:var(--text);background:rgba(var(--a2),.15)}
@media(max-width:960px){
  #drawer{padding:10px}
  #drawer .pane{width:100%;max-height:96vh}
  .m-body{grid-template-columns:minmax(0,1fr);padding:14px}
  .m-head,.m-foot{padding:12px 14px}
}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:#2b2f2f;border-left:4px solid var(--ok);padding:12px 16px;border-radius:var(--r-m);font-size:14px}.toast.err{border-left-color:var(--bad)}
.nav .grp{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:12px 12px 4px}
.nav a .ic{width:18px;height:18px;opacity:.85}.nav a.on .ic{color:var(--accent2);opacity:1}
.btn.dz{background:var(--bad);color:#fff}.btn.g{background:transparent;border:1px solid var(--line2);color:var(--text)}
.ssrch{position:relative;margin:0 2px 8px}.ssrch input{padding-inline-start:34px;font-size:13.5px}.ssrch>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
[dir=rtl] .ssrch>.ic{left:auto;right:11px}
.ssrch ul{position:absolute;left:0;right:0;top:calc(100% + 4px);list-style:none;margin:0;padding:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:40;display:none;max-height:320px;overflow:auto}
.ssrch.on ul{display:block}.ssrch li button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;font-size:13.5px}.ssrch li button:hover,.ssrch li button.on{background:rgba(255,255,255,.06)}.ssrch li small{display:block;color:var(--mute);font-size:12px}
/* S1 sistem şeridi */
.sys{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:12px 16px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);font-size:13.5px;color:var(--soft)}
.sys>span{display:inline-flex;align-items:center;gap:7px}.sys b{color:var(--text)}.sys .ic{width:16px;height:16px}.sys .okc{color:var(--ok)}.sys .wc{color:var(--warn)}.sys .bc{color:var(--bad)}
.sys button{background:none;border:0;color:var(--warn);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
/* S2 gruplu sayılar */
.kgrp{margin-bottom:20px}.kgrp>h4{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}.kgrp .stats{margin-bottom:0;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kgrp .stat{padding:14px}.kgrp .stat b{font-size:24px}@media(max-width:700px){.kgrp .stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat span.l{font-size:13px;color:var(--soft)}
/* S7 iki sütun */
.hcols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1250px){.hcols{grid-template-columns:minmax(0,1fr)}}
/* S4 cihaz sağlığı */
.devh{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.devh i{width:8px;height:8px;border-radius:50%;background:#666;display:inline-block}.devh i.on{background:var(--ok)}
#popm{position:fixed;z-index:80;display:none;min-width:190px;padding:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:0 14px 34px rgba(0,0,0,.5)}#popm.on{display:block}
#popm button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--soft);font:inherit;font-size:13.5px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;text-align:start}#popm button:hover{background:rgba(255,255,255,.06);color:#fff}
/* S5 kaynak listesi */
.srcl td .tag{margin-inline-end:6px}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  #side .brand{border:0;padding:0;margin:0;margin-right:auto}
  .nav{flex-direction:row;flex:none;order:3;width:100%;overflow-x:auto;padding-bottom:4px}.nav a{white-space:nowrap;padding:8px 12px}
  .sidefoot{flex-direction:row;border:0;padding:0;align-items:center}
  main{padding:20px 16px 60px}.grid2{grid-template-columns:1fr}
}
</style></head><body>
<div class="app">
  <aside id="side">
    <div class="brand"><a href="/super" style="text-decoration:none"><img src="/logo.svg?v=4" alt="ScreenPano" style="height:32px;display:block"></a><small>Süper Yönetim</small></div>
    <div class="ssrch" id="ssrch"><svg class="ic"><use href="/icons.svg#i-search"></use></svg><input type="search" id="gq" placeholder="İşletme ara" autocomplete="off" oninput="gSearch(this.value)" onfocus="gSearch(this.value)" onkeydown="gKey(event)"><ul id="gres"></ul></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><span data-langpick></span><a href="/tv" target="_blank"><svg class="ic"><use href="/icons.svg#i-external-link"></use></svg> TV sayfası</a></div>
  </aside>
  <main id="main"><div class="empty">Yükleniyor…</div></main>
</div>
<div id="drawer"><div class="bg" onclick="closeDrawer()"></div><div class="pane" id="pane"></div></div>
<div id="toasts"></div>
<script src="/ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = s => I18N.t(s);
const nf = n => Number(n || 0).toLocaleString(I18N.locale);
const fmt = ms => ms ? new Date(ms).toLocaleDateString(I18N.locale, { day: '2-digit', month: '2-digit', year: 'numeric' }) : '-';
const fmtD = d => d ? new Date(d + 'T12:00').toLocaleDateString(I18N.locale, { day: 'numeric', month: 'short' }) : '';
const ago = ms => { if (!ms) return '-'; const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + ' ' + T('dk') : m < 1440 ? Math.round(m / 60) + ' ' + T('sa') : Math.round(m / 1440) + ' ' + T('gün'); };
const hrs = m => (m / 60).toFixed(m < 600 ? 1 : 0).replace('.', ',');
const dur = sec => sec >= 3600 ? hrs(sec / 60) + ' ' + T('sa') : Math.max(1, Math.round(sec / 60)) + ' ' + T('dk');
const size = b => b >= 1073741824 ? (b / 1073741824).toFixed(1) + ' GB' : b >= 1048576 ? Math.round(b / 1048576) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = T(m); $('toasts').appendChild(t); setTimeout(() => t.remove(), 4500); }
async function call(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) location.href = '/login';
  if (!r.ok) throw new Error(j.error || 'Hata ' + r.status);
  return j;
}
const api = (m, u, b) => call(m, '/api/super' + u, b);

/* ---------- sayfa yapısı ---------- */
// S8: menü üç başlıkta (izleme, müşteriler, sistem); metin olan öğe grup başlığıdır
const NAV_G = ['İzleme', ['home', 'layout-dashboard', 'Genel bakış'], ['stats', 'chart-column', 'İstatistik'], ['notify', 'bell', 'Bildirimler'], 'Müşteriler', ['tenants', 'building-2', 'İşletmeler'], ['ads', 'megaphone', 'Reklamlar'], 'Sistem', ['sources', 'plug', 'Veri kaynakları'], ['legal', 'file-text', 'Yasal ve site'], ['backup', 'hard-drive', 'Yedek ve depolama'], ['account', 'user', 'Hesabım']];
const NAV = NAV_G.filter(Array.isArray);
const ic = n => `<svg class="ic" aria-hidden="true"><use href="/icons.svg#i-${n}"></use></svg>`;
let D = null, page = 'home', P = null, PAT = 0;
const ST = { days: 30, tid: 'all' }, TF = { q: '', f: 'all', sort: 'new' };
const pageOf = () => { const h = (location.hash || '#home').slice(1).split('/')[0]; return NAV.some(n => n[0] === h) ? h : 'home'; };

/* ---------- dikkat gerektirenler ---------- */
function attention() {
  const out = [], now = Date.now(), day = 86400000;
  for (const o of D.offline) out.push({ lv: 'bad', t: `${o.tenant} · ${o.name || T('TV kutusu')}`, s: `${T('Çevrimdışı kaldı')}: ${ago(o.lastSeen)}`, act: [T('Panele gir'), `imp('${o.tenantId}')`] });
  for (const x of D.tenants) {
    const a = x.access;
    if (x.deletion) out.push({ lv: 'bad', t: x.name, s: `${T('KVKK silme talebi')}: ${fmt(x.deletion)}`, act: [T('Aç'), `openTenant('${x.id}')`] });
    else if (a.ok && a.kind === 'trial' && a.until - now <= 3 * day) out.push({ lv: 'warn', t: x.name, s: `${T('Deneme süresi bitiyor')}: ${fmt(a.until)}`, act: [T('Aç'), `openTenant('${x.id}')`] });
    else if (a.ok && a.kind === 'paid' && a.until - now <= 7 * day) out.push({ lv: 'warn', t: x.name, s: `${T('Abonelik bitiyor')}: ${fmt(a.until)}`, act: [T('Aç'), `openTenant('${x.id}')`] });
    else if (!a.ok && a.reason === 'expired' && now - Math.max(x.paidUntil || 0, x.trialUntil || 0) <= 14 * day) out.push({ lv: 'bad', t: x.name, s: `${T('Süresi doldu')}: ${fmt(Math.max(x.paidUntil || 0, x.trialUntil || 0))}`, act: [T('Aç'), `openTenant('${x.id}')`] });
  }
  // S3: depolaması %90'ı geçen işletme
  for (const x of D.tenants) if (x.storageLimitMB && x.storageMB >= x.storageLimitMB * 0.9) out.push({ lv: x.storageMB >= x.storageLimitMB ? 'bad' : 'warn', t: x.name, s: `${T('Depolama dolmak üzere')}: ${x.storageMB} / ${x.storageLimitMB} MB`, act: [T('Aç'), `openTenant('${x.id}')`] });
  // S3b: bekleyen ek şube ücreti (faturalama elle yapılır)
  for (const x of D.tenants) { const pend = (x.charges || []).filter(c => c.status !== 'paid'); if (pend.length) out.push({ lv: 'warn', t: x.name, s: `${T('Ek şube ücreti bekliyor')}: ${pend.reduce((a, c) => a + (Number(c.amount) || 0), 0)} TL · ${pend.length} ${T('kayıt')}`, act: [T('Aç'), `openTenant('${x.id}')`] }); }
  const fl = (D.system || {}).fleet || {};
  for (const d of (fl.old || []).slice(0, 10)) out.push({ lv: 'warn', t: `${d.tenant} · ${d.name || T('TV kutusu')}`, s: `${T('Eski uygulama sürümü')}: ${d.app} → ${D.system.apk}`, act: [T('Panele gir'), `imp('${d.tenantId}')`] });
  for (const d of (fl.noBoot || []).slice(0, 10)) out.push({ lv: 'warn', t: `${d.tenant} · ${d.name || T('TV kutusu')}`, s: T('Açılışta otomatik başlama izni verilmemiş'), act: [T('Panele gir'), `imp('${d.tenantId}')`] });
  out.sort((a, b) => (a.lv === 'bad' ? 0 : 1) - (b.lv === 'bad' ? 0 : 1));
  const s = D.settings;
  if (!s.collect_key) out.push({ lv: 'warn', t: T('CollectAPI anahtarı yok'), s: T('Eczane, haber ve kitap verileri çekilemez'), act: [T('Aç'), "go('sources')"] });
  if (!s.tmdb_key) out.push({ lv: 'warn', t: T('TMDB anahtarı yok'), s: T('Sinema verileri çekilemez'), act: [T('Aç'), "go('sources')"] });
  if (D.backup.error) out.push({ lv: 'bad', t: T('Son yedek başarısız'), s: D.backup.error, act: [T('Aç'), "go('backup')"] });
  else if (!D.backup.at || now - D.backup.at > 36 * 3600000) out.push({ lv: 'warn', t: T('Yedek eski ya da yok'), s: D.backup.at ? `${T('Son yedek')}: ${new Date(D.backup.at).toLocaleString(I18N.locale)}` : T('Henüz yedek alınmadı'), act: [T('Aç'), "go('backup')"] });
  if (D.storage.lastError) out.push({ lv: 'bad', t: T('Medya depolama hatası'), s: D.storage.lastError, act: [T('Aç'), "go('backup')"] });
  if (!D.mail) out.push({ lv: 'warn', t: T('SMTP ayarlı değil'), s: T('İşletmelere e-posta uyarısı gönderilemez'), act: [T('Aç'), "go('notify')"] });
  return out;
}
const attCount = () => D ? attention().filter(a => a.lv === 'bad').length : 0;

/* ---------- gezinme ---------- */
function drawNav() {
  const n = D ? attCount() : 0;
  $('nav').innerHTML = NAV_G.map(x => typeof x === 'string' ? `<div class="grp">${x}</div>` : `<a href="#${x[0]}" class="${page === x[0] ? 'on' : ''}">${ic(x[1])}${x[2]}${x[0] === 'home' && n ? `<span class="n">${n}</span>` : ''}</a>`).join('');
}
function go(p) { location.hash = p; }
// S8: her sayfadan işletme arama
let GI = 0;
function gSearch(q) {
  const box = $('ssrch'), ul = $('gres'); q = String(q || '').trim().toLocaleLowerCase('tr-TR');
  if (!D || !q) { box.classList.remove('on'); return; }
  const hit = D.tenants.filter(x => [x.name, x.owner, x.phone, x.email].join(' ').toLocaleLowerCase('tr-TR').includes(q)).slice(0, 8); GI = 0;
  ul.innerHTML = hit.length ? hit.map((x, i) => `<li><button type="button" class="${i ? '' : 'on'}" onmousedown="event.preventDefault();gOpen('${x.id}')"><b>${esc(x.name)}</b><small>${esc(x.owner || '')}${x.phone ? ' · ' + esc(x.phone) : ''}</small></button></li>`).join('') : `<li><small style="padding:8px 10px;display:block;color:var(--mute)">${T('Sonuç yok')}</small></li>`;
  box.classList.add('on');
}
function gKey(e) {
  const b = [...$('gres').querySelectorAll('button')]; if (!b.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); GI = (GI + (e.key === 'ArrowDown' ? 1 : b.length - 1)) % b.length; b.forEach((x, i) => x.classList.toggle('on', i === GI)); }
  else if (e.key === 'Enter') { e.preventDefault(); b[GI].dispatchEvent(new MouseEvent('mousedown')); }
  else if (e.key === 'Escape') $('ssrch').classList.remove('on');
}
function gOpen(id) { $('ssrch').classList.remove('on'); $('gq').value = ''; if (page !== 'tenants') go('tenants'); setTimeout(() => openTenant(id), 60); }
document.addEventListener('click', e => { if (!e.target.closest('#ssrch')) $('ssrch').classList.remove('on'); });
function popMenu(anchor, items) {
  let m = $('popm'); if (!m) { m = document.createElement('div'); m.id = 'popm'; document.body.appendChild(m); addEventListener('click', () => m.classList.remove('on')); addEventListener('scroll', () => m.classList.remove('on'), true); }
  m.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}">${ic(it[1])}<span>${esc(T(it[0]))}</span></button>`).join('');
  m.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); m.classList.remove('on'); items[+b.dataset.i][2](); });
  m.classList.add('on'); const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px'; m.style.top = (r.bottom + h + 8 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
}
function render() {
  page = pageOf(); drawNav();
  if (!D) return;
  const pg = PAGES[page]; $('main').innerHTML = pg.html(); if (pg.after) pg.after();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', () => { closeDrawer(); render(); });

const head = (title, sub, right = '') => `<div class="top"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${right}</div>`;
const card = (title, sub, body, foot = '', badge = '') => `<div class="card"><h2>${title}${badge}</h2>${sub ? `<p class="hint">${sub}</p>` : ''}${body}${foot ? `<div class="cardfoot">${foot}</div>` : ''}</div>`;
const field = (label, id, val = '', attrs = '') => `<div><label>${label}</label><input id="${id}" value="${esc(val)}" ${attrs}></div>`;
const setting = (label, k, attrs = '') => field(label, 's-' + k, D.settings[k] || '', attrs);
const stat = (b, label, extra = '') => `<div class="stat"><b>${b}</b><span>${T(label)}${extra}</span></div>`;
const dl = (cur, prev, goodUp = true) => { if (!prev) return ''; const p = Math.round((cur - prev) / prev * 100); if (!p) return ''; const good = (p > 0) === goodUp; return `<br><b class="dl ${good ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</b> <span style="display:inline">${T('önceki döneme göre')}</span>`; };
const tabs = (cur, fn) => `<div class="tabs">${[7, 30, 90].map(d => `<button class="${cur === d ? 'on' : ''}" onclick="${fn}(${d})">${d} ${T('gün')}</button>`).join('')}</div>`;

function stTag(x) {
  const now = Date.now(), day = 86400000;
  if (!x.access.ok) {
    if (x.access.reason === 'suspended') return '<span class="tag bad">Askıda</span>';
    const endMs = x.paidUntil || x.trialUntil || 0;
    const agoDays = endMs ? Math.max(1, Math.round((now - endMs) / day)) : 0;
    return `<span class="tag bad" title="${fmt(endMs)}">Süresi doldu${agoDays ? ` (${agoDays}g)` : ''}</span>`;
  }
  let out = '';
  if (x.deletion) out += `<span class="tag bad" title="KVKK silme talebi">Silinecek ${fmt(x.deletion)}</span> `;
  if (x.access.kind === 'unlimited') return out + '<span class="tag ok">∞ Sınırsız</span>';
  const until = x.access.until || x.paidUntil || x.trialUntil;
  const rem = until ? Math.ceil((until - now) / day) : null;
  const remTxt = rem !== null ? (rem <= 0 ? ' (Son gün)' : ` (${rem}g)`) : '';
  const isWarn = rem !== null && rem <= 3;
  if (x.access.kind === 'trial') return out + `<span class="tag trial" title="${fmt(until)}">Deneme${remTxt}</span>`;
  return out + `<span class="tag ${isWarn ? 'warn' : 'ok'}" title="${fmt(until)}">Aktif${remTxt}</span>`;
}
const planName = x => x.unlimited ? 'Sınırsız' : (D.plans[x.plan] || {}).name || x.plan;
function planBadge(x) {
  if (x.unlimited) return '<span class="tag ok" style="background:rgba(62,207,74,.18);font-weight:700">∞ Sınırsız</span>';
  const p = x.plan;
  const name = esc((D.plans[p] || {}).name || p);
  if (p === 'pro') return `<span class="tag" style="background:rgba(201,149,92,.22);color:var(--accent2);font-weight:700">${name}</span>`;
  if (p === 'baslangic') return `<span class="tag mute">${name}</span>`;
  return `<span class="tag">${name}</span>`;
}
const headOf = o => D.tenants.find(t => t.org === o && t.owner);

const PAGES = {};

PAGES.home = {
  html() {
    const t = D.totals, now = Date.now(), day = 86400000, sy = D.system || { fleet: {} }, fl = sy.fleet || {};
    const att = attention(), recent = D.tenants.filter(x => x.owner || !x.org).sort((a, b) => b.created - a.created).slice(0, 6);
    const live = D.tenants.filter(x => x.access.ok), by = {};
    for (const x of live) by[x.plan] = (by[x.plan] || 0) + 1;
    const mx = Math.max(1, ...Object.values(by));
    const n7 = D.tenants.filter(x => (x.owner || !x.org) && now - x.created <= 7 * day).length;
    const trials = live.filter(x => x.access.kind === 'trial').length;
    const bk = D.backup || {}, bkOk = bk.at && !bk.error && now - bk.at < 36 * 3600000;

      + card('Dikkat gerektirenler', att.length ? 'Kırmızılar acil, sarılar yakında ilgilenilecek işler.' : '', att.length ? att.slice(0, 20).map(a => `<div class="att ${a.lv === 'bad' ? 'bad' : ''}"><div class="b"><b>${esc(a.t)}</b><span>${esc(a.s)}</span></div><button class="btn ghost sm" onclick="${a.act[1]}">${esc(a.act[0])}</button></div>`).join('') : '<div class="att ok"><div class="b"><b>Her şey yolunda</b><span>Şu an ilgilenmeniz gereken bir şey yok.</span></div></div>')
      + `</div><div>`
      + `<div id="pchart"></div>`
      + card('Son kayıt olanlar', '', recent.length ? `<div class="scroll"><table><tbody>${recent.map(x => `<tr class="click" onclick="openTenant('${x.id}')"><td><b>${esc(x.name)}</b><br><span style="color:var(--mute)">${esc(x.owner || '')}</span></td><td>${stTag(x)}</td><td class="num">${ago(x.created)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">İşletme yok</div>')
      + card('Paket dağılımı', 'Ekranı açık işletmeler.', Object.keys(D.plans).length ? Object.values(D.plans).map(p => `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(p.name)}</span><b>${by[p.id] || 0}</b></div><div class="bar"><i style="width:${Math.round((by[p.id] || 0) / mx * 100)}%"></i></div></div>`).join('') : '')
      + `</div></div>`;
  },
  async after() {
    try { if (!P || Date.now() - PAT > 60000) { P = await api('GET', '/stats?days=30'); PAT = Date.now(); } } catch (e) { return; }
    const el = $('pstats'); if (!el) return;
    el.innerHTML = `<div class="stats">${stat(hrs(P.totals.online) + ' ' + T('saat'), 'Ekran süresi', dl(P.totals.online, P.prev.online))}${stat(nf(P.totals.plays), 'İçerik oynatıldı', dl(P.totals.plays, P.prev.plays))}${stat(nf(P.totals.scans), 'QR okutuldu', dl(P.totals.scans, P.prev.scans))}${stat(nf(P.totals.drops), 'Ekran kesintisi', dl(P.totals.drops, P.prev.drops, false))}</div>`;
    const c = $('pchart'); if (c && P.daily && P.daily.length) c.innerHTML = barsCard('Günlük ekran süresi', 'Son 30 gün, tüm işletmelerin toplamı (saat).', P.daily, 'online', v => hrs(v) + ' ' + T('saat'));
  },
};

const FILTERS = [['all', 'Tümü'], ['active', 'Aktif'], ['trial', 'Deneme'], ['unlimited', 'Sınırsız'], ['expired', 'Süresi dolan'], ['suspended', 'Askıda'], ['offline', 'Çevrimdışı TV'], ['old', 'Eski APK']];
const inK = (x, k) => {
  const a = x.access;
  return {
    all: true,
    trial: a.ok && a.kind === 'trial',
    active: a.ok && a.kind === 'paid',
    unlimited: a.ok && a.kind === 'unlimited',
    suspended: !a.ok && a.reason === 'suspended',
    expired: !a.ok && a.reason === 'expired',
    offline: D.offline.some(o => o.tenantId === x.id),
    old: (x.fleet || []).some(d => d.old)
  }[k];
};
const inF = x => inK(x, TF.f);

// S4: cihaz sağlığı (çevrimiçi sayısı, eski sürüm)
function devCell(x) {
  const f = x.fleet || [], on = f.filter(d => d.online).length, lim = x.customDevices ? x.customDevices : (x.unlimited ? '∞' : (x.deviceLimit || 1)), old = f.filter(d => d.old).length;
  if (!x.devices) return `<span style="color:var(--mute);font-size:12px">0 / ${lim} TV</span>`;
  const dots = f.slice(0, 4).map(d => `<i class="${d.online ? 'on' : ''}"></i>`).join('') + (f.length > 4 ? `+${f.length - 4}` : '');
  const title = f.map(d => (d.name || 'TV') + ': ' + (d.online ? 'Çevrimiçi' : 'Çevrimdışı') + (d.app ? ' (' + d.app + ')' : '')).join('\n');
  return `<span class="devh" title="${esc(title)}">${dots} <b style="color:${on > 0 ? 'var(--ok)' : 'var(--mute)'};margin-left:3px">${on}/${x.devices}</b></span>`
    + (old ? `<br><span class="tag warn" style="font-size:10px;padding:1px 5px;margin-top:2px" title="Eski APK sürümü">${old} eski APK</span>` : '')
    + `<br><span style="color:var(--mute);font-size:11px">sınır: ${lim}</span>`;
}

function rowMenu(ev, id) {
  ev.stopPropagation();
  popMenu(ev.currentTarget, [
    ['Ayrıntılar ve düzenleme', 'pencil', () => openTenant(id)],
    ['30 gün uzat', 'calendar-clock', () => extend(id, 30)],
    ['1 yıl uzat', 'calendar-clock', () => extend(id, 365)],
    ['İstatistikleri gör', 'chart-column', () => { ST.tid = id; ST.days = 30; go('stats'); render(); }],
    ['Şifre sıfırla', 'key-round', () => resetPw(id)]
  ]);
}

function drawRows() {
  if (!$('list')) return;
  const q = TF.q.trim().toLocaleLowerCase('tr-TR');
  const clr = $('flt-clear');
  if (clr) clr.style.display = q ? 'flex' : 'none';

  // şubeler (sahibi olmayan zincir üyeleri) ana işletmelerinin satırı altında iç içe gösterilir
  const brOf = {};
  for (const b of D.tenants) if (!b.owner && b.org && headOf(b.org)) (brOf[b.org] || (brOf[b.org] = [])).push(b);
  for (const o of Object.keys(brOf)) brOf[o].sort((a, b) => a.created - b.created);
  const tops = D.tenants.filter(x => !(brOf[x.org] || []).some(b => b.id === x.id));

  // KPI şeridi güncelle
  const kpiEl = $('tenants-kpi');
  if (kpiEl) {
    const total = tops.length;
    const activeN = tops.filter(x => inK(x, 'active') || inK(x, 'unlimited')).length;
    const trialN = tops.filter(x => inK(x, 'trial')).length;
    const expN = tops.filter(x => inK(x, 'expired') || inK(x, 'suspended')).length;
    const offN = D.tenants.filter(x => inK(x, 'offline')).length; // cihaz bazlı: şubeler de sayılır
    const oldN = D.tenants.filter(x => inK(x, 'old')).length;

    kpiEl.innerHTML = `<div class="kpi-ribbon">
      <div class="kpi-card ${TF.f === 'all' ? 'on' : ''}" onclick="TF.f='all';drawRows()">
        <span class="kic">${ic('building-2')}</span>
        <b>${total}</b>
        <span>Tüm İşletmeler</span>
      </div>
      <div class="kpi-card ${TF.f === 'active' ? 'on' : ''}" onclick="TF.f='active';drawRows()">
        <span class="kic" style="color:var(--ok)">${ic('circle-check')}</span>
        <b style="color:var(--ok)">${activeN}</b>
        <span>Aktif / Sınırsız</span>
      </div>
      <div class="kpi-card ${TF.f === 'trial' ? 'on' : ''}" onclick="TF.f='trial';drawRows()">
        <span class="kic" style="color:var(--accent2)">${ic('clock')}</span>
        <b style="color:var(--accent2)">${trialN}</b>
        <span>Deneme Süresinde</span>
      </div>
      <div class="kpi-card ${TF.f === 'expired' || TF.f === 'suspended' ? 'on' : ''}" onclick="TF.f='expired';drawRows()">
        <span class="kic" style="color:var(--bad)">${ic('triangle-alert')}</span>
        <b style="color:var(--bad)">${expN}</b>
        <span>Süresi Dolan / Askıda</span>
      </div>
      <div class="kpi-card ${TF.f === 'offline' ? 'on' : ''}" onclick="TF.f='offline';drawRows()">
        <span class="kic" style="color:${offN ? 'var(--bad)' : 'var(--mute)'}">${ic('wifi-off')}</span>
        <b style="color:${offN ? 'var(--bad)' : 'var(--mute)'}">${offN}</b>
        <span>Çevrimdışı TV</span>
      </div>
      <div class="kpi-card ${TF.f === 'old' ? 'on' : ''}" onclick="TF.f='old';drawRows()">
        <span class="kic" style="color:${oldN ? 'var(--warn)' : 'var(--mute)'}">${ic('package')}</span>
        <b style="color:${oldN ? 'var(--warn)' : 'var(--mute)'}">${oldN}</b>
        <span>Eski Sürüm APK</span>
      </div>
    </div>`;
  }

  // Filtre etiketleri
  const chipsEl = $('chips');
  if (chipsEl) {
    chipsEl.innerHTML = FILTERS.map(([k, l]) => {
      const base = ['offline', 'old'].includes(k) ? D.tenants : tops; // cihaz bazlı filtrelerde şubeler de sayılır
      const n = base.filter(x => inK(x, k)).length;
      return `<span class="chip ${TF.f === k ? 'on' : ''}" onclick="TF.f='${k}';drawRows()">${l} <b>${n}</b></span>`;
    }).join('');
  }

  const end = x => x.access.until || x.paidUntil || x.trialUntil || 0;
  const cmp = {
    new: (a, b) => b.created - a.created,
    name: (a, b) => a.name.localeCompare(b.name, 'tr'),
    end: (a, b) => end(a) - end(b),
    login: (a, b) => (b.lastLogin || 0) - (a.lastLogin || 0)
  }[TF.sort];

  const hits = x => [x.name, x.owner, x.phone, x.email, x.note, planName(x)].join(' ').toLocaleLowerCase('tr-TR').includes(q)
    || (brOf[x.org] || []).some(b => b.name.toLocaleLowerCase('tr-TR').includes(q)); // şube adıyla arama ana işletmeyi bulur
  const list = tops.filter(x => inF(x) && (!q || hits(x))).sort(cmp);

  // Sonuç sayısı
  const cntEl = $('tenant-count');
  if (cntEl) {
    const nb = D.tenants.length - tops.length;
    cntEl.innerHTML = (q || TF.f !== 'all')
      ? `<b>${list.length}</b> / ${tops.length} işletme`
      : `Toplam <b>${tops.length}</b> işletme${nb ? ` · <b>${nb}</b> şube` : ''}`;
  }

  // şube alt satırı: ana işletmenin hemen altında, sönük ve girintili
  const branchRow = b => `<tr class="click" onclick="openTenant('${b.id}')" style="background:rgba(255,255,255,.015)">
      <td style="padding-left:36px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="color:var(--mute);font-size:11px">└</span>
          <b style="font-size:12.5px;color:var(--text);opacity:.85">${esc(b.name)}</b>
          <span class="tag mute" style="font-size:10px">Şube</span>
        </div>
      </td>
      <td>${planBadge(b)}</td>
      <td>${stTag(b)}</td>
      <td style="font-size:12px;white-space:nowrap">${b.unlimited ? '<span style="color:var(--ok)">∞</span>' : fmt(end(b))}</td>
      <td class="num">${devCell(b)}</td>
      <td class="num" style="font-size:12px">${b.storageMB} MB</td>
      <td style="font-size:11.5px;color:var(--mute)">-</td>
      <td style="padding-right:16px" onclick="event.stopPropagation()">
        <div class="acts" style="justify-content:flex-end;gap:5px">
          <button class="btn ghost sm" onclick="imp('${b.id}')" title="Şubenin paneline gir">${ic('external-link')}</button>
        </div>
      </td>
    </tr>`;

  $('list').innerHTML = list.map(x => {
    const endDate = end(x);
    const endStr = x.unlimited ? '<span style="color:var(--ok);font-weight:600">∞ Sınırsız</span>' : fmt(endDate);
    const nb = (brOf[x.org] || []).length;
    const brs = q ? (brOf[x.org] || []).filter(b => b.name.toLocaleLowerCase('tr-TR').includes(q)) : (brOf[x.org] || []);
    return `<tr class="click" onclick="openTenant('${x.id}')">
      <td style="padding-left:16px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <b style="font-size:13.5px;color:var(--text)">${esc(x.name)}</b>
          ${x.note ? `<span title="${esc(x.note)}" style="color:var(--accent2);cursor:help;font-size:12px">📝</span>` : ''}
          ${nb ? `<span class="tag mute" style="font-size:10.5px" title="Bu zincirin ${nb} şubesi alt satırlarda">🏢 ${nb} şube</span>` : ''}
          ${x.superAccess ? `<span class="tag warn" style="font-size:10px" title="Süper Yönetici">SUPER</span>` : ''}
        </div>
        <div style="color:var(--mute);font-size:11.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">
          ${x.owner ? `<span><span style="opacity:.7">👤</span> ${esc(x.owner)}</span>` : ''}
          ${x.phone ? `<span><span style="opacity:.7">📞</span> ${esc(x.phone)}</span>` : ''}
          ${x.email ? `<span><span style="opacity:.7">✉️</span> ${esc(x.email)}</span>` : ''}
        </div>
      </td>
      <td>${planBadge(x)}</td>
      <td>${stTag(x)}</td>
      <td style="font-size:12.5px;white-space:nowrap">${endStr}</td>
      <td class="num">${devCell(x)}</td>
      <td class="num" style="font-size:12.5px">${x.storageMB} MB</td>
      <td style="font-size:12px;white-space:nowrap" title="${x.lastLogin ? new Date(x.lastLogin).toLocaleString(I18N.locale) : ''}">${ago(x.lastLogin)}</td>
      <td style="padding-right:16px" onclick="event.stopPropagation()">
        <div class="acts" style="justify-content:flex-end;gap:5px">
          <button class="btn sm" onclick="imp('${x.id}')" title="İşletmenin paneline gir (impersonate)">${ic('external-link')} Panele gir</button>
          <button class="btn ghost sm" onclick="extend('${x.id}',30)" title="Aboneliği 30 gün uzat">+30g</button>
          <button class="btn ghost sm" title="Diğer işlemler" aria-label="Diğer işlemler" onclick="rowMenu(event,'${x.id}')">${ic('ellipsis')}</button>
        </div>
      </td>
    </tr>` + brs.map(branchRow).join('');
  }).join('') || `<tr><td colspan="8" class="empty" style="padding:40px 10px"><div style="font-size:24px;margin-bottom:8px">🔍</div>Arama kriterlerine uygun işletme bulunamadı.${q || TF.f !== 'all' ? '<br><button class="btn ghost sm" style="margin-top:12px" onclick="TF.q=\'\';TF.f=\'all\';const el=$(\'flt\');if(el)el.value=\'\';drawRows()">Filtreleri Temizle</button>' : ''}</td></tr>`;
}

async function createT() {
  try {
    await api('POST', '/tenants', { name: $('n-name').value, phone: $('n-phone').value, username: $('n-user').value, password: $('n-pass').value, plan: $('n-plan').value, devices: Number($('n-devs').value) || 1, days: Number($('n-days').value), trialDays: Number($('n-trial').value) });
    closeDrawer();
    toast('İşletme oluşturuldu');
    await load();
  } catch (e) { toast(e.message, true); }
}

function addInputDays(id, days) {
  const el = $(id);
  if (!el) return;
  const cur = el.value ? new Date(el.value + 'T12:00:00') : new Date();
  const base = cur.getTime() > Date.now() ? cur : new Date();
  base.setDate(base.getDate() + days);
  const y = base.getFullYear(), m = String(base.getMonth() + 1).padStart(2, '0'), d = String(base.getDate()).padStart(2, '0');
  el.value = `${y}-${m}-${d}`;
  toast(`Tarih güncellendi: ${el.value}`);
}

function openTenant(id) {
  const x = D.tenants.find(t => t.id === id); if (!x) return;
  const d = ms => {
    if (!ms) return '';
    const dt = new Date(ms);
    const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, '0'), day = String(dt.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  };
  const h = !x.owner && x.org ? headOf(x.org) : null;
  const lim = x.customDevices ? x.customDevices : (x.unlimited ? '∞' : (x.deviceLimit || 1));
  const devs = x.fleet || [];
  // zincir lokasyonları: ana hesap (sahibi olan) başta, şubeler kuruluş sırasıyla
  const chain = x.org ? D.tenants.filter(t => t.org === x.org) : [];
  const homeT = chain.find(t => t.owner) || chain[0];
  const chainRows = chain.slice().sort((a, b) => (b.id === homeT.id) - (a.id === homeT.id) || a.created - b.created);

      </div>
    </div>

      <button class="btn sm" onclick="imp('${id}')" title="İşletmenin yönetim paneline gir">${ic('external-link')} Panele gir</button>
      <button class="btn ghost sm" onclick="extend('${id}',30)">${ic('calendar-clock')} +30 gün uzat</button>
      <button class="btn ghost sm" onclick="extend('${id}',365)">+1 yıl uzat</button>
      <button class="btn ghost sm" onclick="ST.tid='${id}';ST.days=30;closeDrawer();go('stats');render()">${ic('chart-column')} İstatistikler</button>
      <button class="modal-x" onclick="closeDrawer()" aria-label="Kapat" title="Kapat (ESC)">×</button>
    </div>
  </div>

  <div class="m-body">

      <!-- Kart 1: İşletme ve Giriş Bilgileri -->

        <div class="row">${field('İşletme adı', 'e-name', x.name)}${field('Telefon', 'e-phone', x.phone || '')}</div>
        <div class="row">${field('Kullanıcı adı (giriş)', 'e-user', x.owner || '', 'autocomplete="off" autocapitalize="none"')}${field('E-posta (bildirimler)', 'e-mail', x.email || '', 'type="email"')}</div>
        <div><label>Yönetici Notu</label><textarea id="e-note" rows="2" style="font-size:13px" placeholder="Müşteriyle ilgili dahili notlar (yalnızca süper admin görür)...">${esc(x.note || '')}</textarea></div>
      </div>

      <!-- Kart 2: Paket, Durum ve Süre -->
      <div class="d-card">
        <h4>${ic('calendar-clock')} Abonelik, Paket ve Süre</h4>
        <div class="row">
          <div><label>Paket</label><select id="e-plan">${planOpts(x.plan)}</select></div>

        ${x.org ? `<label class="check-box-label" style="border-color:var(--accent2);background:rgba(var(--a2),.08)"><input type="checkbox" id="e-org"><span><b>Zincir Şube Eşitleme:</b> Paket ve süreyi zincirin tüm şubelerine uygula</span></label>` : ''}

      ${chain.length > 1 ? `
      <!-- Kart 3b: Zincir Lokasyonları -->
      <div class="d-card">
        <h4>${ic('building-2')} Zincir Lokasyonları (${chain.length})</h4>

          <td><b>${esc(t.name)}</b> ${t.id === homeT.id ? '<span class="tag ok">Ana Hesap</span>' : '<span class="tag mute">Şube</span>'}</td>
          <td>${stTag(t)}</td>
          <td class="num">${t.devices} ${T('cihaz')}${t.online ? ` · ${t.online} ${T('çevrimiçi')}` : ''}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn ghost sm" onclick="openTenant('${t.id}')" title="Bu lokasyonun ayrıntılarını aç">${T('Aç')}</button>
            <button class="btn ghost sm" onclick="imp('${t.id}')" title="Bu lokasyonun yönetim paneline gir">${T('Panel')}</button>
            ${t.id !== homeT.id ? `<button class="btn ghost sm" data-nm="${esc(t.name)}" onclick="renBranchT('${t.id}','${x.id}',this.dataset.nm)">${T('Adlandır')}</button>
            <button class="btn ghost sm" style="color:var(--bad)" data-nm="${esc(t.name)}" onclick="delBranchT('${t.id}','${x.id}',this.dataset.nm)">${T('Sil')}</button>` : ''}
          </td>
        </tr>`).join('')}</tbody></table></div>
        <small class="hint" style="margin:0">${T('Ana hesabı silmek tüm zinciri siler; şube silmek yalnızca o şubeyi kaldırır. Şube adı onayı istenir.')}</small>
      </div>` : ''}
    </div>

    <!-- SAĞ SÜTUN: İstatistikler, TV Cihazları, Güvenlik -->
    <div class="m-col">
      ${x.deletion ? `<div class="att bad"><div class="b"><b>KVKK silme talebi</b><span>${fmt(x.deletion)} tarihinde silinecek.</span></div><button class="btn ghost sm" onclick="api('DELETE','/tenants/${id}/deletion').then(()=>{closeDrawer();load()})">Talebi iptal et</button></div>` : ''}

const dateMs = v => v ? Date.parse(v + 'T23:59:00+03:00') : null;
async function saveT(id) {
  try {
    await api('PUT', '/tenants/' + id, {
      name: $('e-name').value,
      phone: $('e-phone').value,
      plan: $('e-plan').value,
      devices: Number($('e-devs').value) || 1,
      status: $('e-status').value,
      trialUntil: dateMs($('e-trial').value),
      paidUntil: dateMs($('e-paid').value),
      note: $('e-note').value,
      username: $('e-user').value,
      email: $('e-mail').value,
      unlimited: $('e-unl').checked,
      superAccess: $('e-sup').checked,
      canTest: $('e-test').checked,
      applyOrg: !!($('e-org') && $('e-org').checked)
    });
    closeDrawer();
    toast('Kaydedildi');
    await load();
  } catch (e) { toast(e.message, true); }
}

async function extend(id, days) {
  try {
    await api('PUT', '/tenants/' + id, { extendDays: days, applyOrg: !!($('e-org') && $('e-org').checked) });
    closeDrawer();
    toast(`${days} gün eklendi`);
    await load();
  } catch (e) { toast(e.message, true); }
}

// ek ücret kaydını ödendi/ödemedi işaretle; drawer güncel veriyle yeniden açılır
async function chargePaid(id, cid, paid = true) {
  try {
    await api('POST', `/tenants/${id}/charges/${cid}`, { paid });
    toast(paid ? 'Ödendi işaretlendi' : 'Ödeme işareti kaldırıldı');
    await load();
    openTenant(id);
  } catch (e) { toast(e.message, true); }
}

async function resetPw(id) {
  const pw = await UI.ask('Yeni şifre (boş bırakırsanız rastgele üretilir):', { input: '', ok: 'Şifreyi sıfırla' });
  if (pw === null) return;
  try {
    const j = await api('POST', `/tenants/${id}/password`, { password: pw });
    UI.ask(`${T('Kullanıcı')}: ${j.username}\n${T('Yeni şifre')}: ${j.password}`, { title: 'Yeni şifre', cancel: 'Kapat', ok: 'Kopyala' }).then(ok => {
      if (ok) navigator.clipboard.writeText(j.password).then(() => toast('Kopyalandı')).catch(() => {});
    });
  } catch (e) { toast(e.message, true); }
}

async function delT(id) {
  const x = D.tenants.find(t => t.id === id);
  const c = await UI.ask(`${T('Bu işlem işletmenin tüm verilerini ve medyasını kalıcı olarak siler.')}\n${T('Onaylamak için işletme adını aynen yazın')}: ${x.name}`, { input: '', ok: 'Sil', danger: true });
  if (c === null) return;
  try {
    await api('DELETE', '/tenants/' + id, { confirm: c });
    closeDrawer();
    toast('Silindi');
    await load();
  } catch (e) { toast(e.message, true); }
}

// şube adlandır (işletme detayındaki zincir kartından): kaydedince açılış yapan drawer yenilenir
async function renBranchT(id, origin, cur) {
  const n = await UI.ask('Yeni şube adı:', { title: 'Şubeyi Adlandır', input: cur || '', ok: 'Kaydet' });
  if (n === null || !n.trim()) return;
  try {
    await api('PUT', '/tenants/' + id, { name: n.trim() });
    toast('Kaydedildi');
    await load();
    openTenant(origin && origin !== id ? origin : id);
  } catch (e) { toast(e.message, true); }
}
// şube sil (yalnızca o şube; ana hesap silinse zincirin tamamı gider): onay için şube adı sorulur
async function delBranchT(id, origin, name) {
  const c = await UI.ask(`Bu şubenin tüm verileri, medyası ve cihazları kalıcı olarak silinir. Onaylamak için şube adını aynen yazın: ${name}`, { input: '', ok: 'Sil', danger: true });
  if (c === null) return;
  try {
    await api('DELETE', '/tenants/' + id, { confirm: c });
    toast('Şube silindi');
    await load();
    if (origin && origin !== id) openTenant(origin); else closeDrawer();
  } catch (e) { toast(e.message, true); }
}

async function imp(id) {
  try {
    const j = await api('POST', `/tenants/${id}/impersonate`);
    location.href = j.next;
  } catch (e) { toast(e.message, true); }
}

function barsCard(title, sub, daily, key, fmtv) {
  const mx = Math.max(1, ...daily.map(d => d[key]));
  return card(title, sub, `<div class="bars" role="img">${daily.map(d => `<div title="${fmtD(d.day)}: ${fmtv(d[key])}"><i style="height:${Math.round(d[key] / mx * 100)}%"></i></div>`).join('')}</div><div class="axis"><span>${fmtD(daily[0].day)}</span><span>${fmtD(daily[daily.length - 1].day)}</span></div>`);
}
async function drawStats() {
  const box = $('stv'); if (!box) return;
  const tid = ST.tid, days = ST.days;
  try {
    if (tid === 'all') {
      const j = await api('GET', '/stats?days=' + days); if (page !== 'stats' || ST.tid !== tid) return;
      const rows = j.tenants.filter(x => x.online || x.plays || x.scans || x.drops).sort((a, b) => b.online - a.online);
      box.innerHTML = `<div class="stats">${stat(hrs(j.totals.online) + ' ' + T('saat'), 'Toplam ekran süresi', dl(j.totals.online, j.prev.online))}${stat(nf(j.totals.plays), 'İçerik oynatıldı', dl(j.totals.plays, j.prev.plays))}${stat(nf(j.totals.scans), 'QR okutuldu', dl(j.totals.scans, j.prev.scans))}${stat(nf(j.totals.drops), 'Ekran kesintisi', dl(j.totals.drops, j.prev.drops, false))}</div>`
        + barsCard('Günlük toplam ekran süresi', 'Saat cinsinden; tüm işletmelerin toplamı.', j.daily, 'online', v => hrs(v) + ' ' + T('saat'))
        + card('İşletme bazında', 'Satıra tıklayınca o işletmenin ayrıntılı istatistiği açılır.', rows.length ? `<div class="scroll"><table><thead><tr><th>İşletme</th><th>Paket</th><th class="num">Ekran süresi</th><th class="num">Oynatma</th><th class="num">QR okutma</th><th class="num">Kesinti</th></tr></thead><tbody>${rows.map(x => `<tr class="click" onclick="ST.tid='${x.id}';render()"><td><b>${esc(x.name)}</b></td><td>${esc((D.plans[x.plan] || {}).name || x.plan)}</td><td class="num">${hrs(x.online)} ${T('sa')}</td><td class="num">${nf(x.plays)}</td><td class="num">${nf(x.scans)}</td><td class="num">${x.drops ? `${x.drops} · ${dur(x.dropsec)}` : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Henüz veri yok.</div>');
    } else {
      const j = await api('GET', `/tenants/${tid}/stats?days=${days}`); if (page !== 'stats' || ST.tid !== tid) return;
      box.innerHTML = `<p style="margin-bottom:16px"><a href="#stats" onclick="ST.tid='all';render();return false">← Tüm platform</a> &nbsp; <button class="btn ghost sm" onclick="imp('${tid}')">Panele gir</button></p>` + tenantStatsHtml(j);
    }
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
// işletme panelindeki İstatistik sayfasıyla aynı içerik
function tenantStatsHtml(j) {
  const active = j.daily.filter(d => d.online > 0).length;
  const wd = i => new Date(2024, 0, 1 + i).toLocaleDateString(I18N.locale, { weekday: 'long' });
  const wds = i => new Date(2024, 0, 1 + i).toLocaleDateString(I18N.locale, { weekday: 'short' });
  const hh = h => String(h).padStart(2, '0') + ':00';
  let pk = { v: 0, d: 0, h: 0 }; j.heat.forEach((row, d) => row.forEach((v, h) => { if (v > pk.v) pk = { v, d, h }; }));
  const hmax = Math.max(1, ...j.heat.flat());
  const dvTxt = d => { const n = d.ios + d.android + d.other; if (!n) return ''; const p = v => Math.round(v / n * 100) + '%'; return [d.ios ? 'iPhone ' + p(d.ios) : '', d.android ? 'Android ' + p(d.android) : '', d.other ? T('Diğer') + ' ' + p(d.other) : ''].filter(Boolean).join(' · '); };
  const qrRow = q => {
    if (!q.tracked) return `<div class="it"><div class="b"><b>${esc(q.label)}</b><span>${q.kind === 'wifi' ? "Wi-Fi QR'ı sayılamaz (telefon doğrudan ağa bağlanır)" : "Düz metin QR'ı sayılamaz (yalnızca bağlantı QR'ları sayılır)"}</span></div></div>`;
    const mx = Math.max(1, ...q.daily), ph = q.hours.indexOf(Math.max(...q.hours));
    return `<div class="it"><div class="b"><b>${esc(q.label)}${q.kind === 'camp' ? ` <span style="color:var(--mute);font-weight:400">${T('· Kampanya kartı')}</span>` : ''}</b><span>${q.scans ? `${T('En yoğun saat')}: ${hh(ph)}${dvTxt(q.dev) ? ' · ' + dvTxt(q.dev) : ''}` : 'Bu dönemde okutulmadı'}</span></div>
      <div class="mini">${q.daily.map((v, i) => `<div title="${fmtD(j.daily[i].day)}: ${v}"><i style="height:${Math.round(v / mx * 100)}%"></i></div>`).join('')}</div><div class="big">${nf(q.scans)}</div></div>`;
  };
  return `<div class="stats">${stat(hrs(j.totals.online) + ' ' + T('saat'), `Ekran açık kaldı (${active} gün)`, dl(j.totals.online, j.prev.online))}${stat(nf(j.totals.plays), 'İçerik oynatıldı', dl(j.totals.plays, j.prev.plays))}${stat(nf(j.totals.scans), 'QR okutuldu', dl(j.totals.scans, j.prev.scans))}${stat(nf(j.totals.drops), j.totals.drops ? `Kesinti (toplam ${dur(j.totals.dropsec)})` : 'Kesinti', dl(j.totals.drops, j.prev.drops, false))}${stat((active ? hrs(j.totals.online / active) : '0') + ' ' + T('saat'), 'Açık olduğu günlerde ortalama')}${stat(pk.v ? `${wd(pk.d)} ${hh(pk.h)}` : '—', 'İçeriklerin en çok gösterildiği zaman')}</div>`
    + barsCard('Günlük ekran süresi', 'Saat cinsinden; bağlı tüm kutuların toplamı.', j.daily, 'online', v => hrs(v) + ' ' + T('saat'))
    + card('QR okutmaları', "Bağlantı QR'ları ve kampanya QR'ı kaç kez okutuldu. Aynı telefonun kısa sürede tekrar açması ve bot ziyaretleri sayılmaz; kişisel bilgi saklanmaz.", j.qr.length ? j.qr.map(qrRow).join('') : '<div class="empty">Bu işletmenin QR kodu yok.</div>')
    + card('Saat bazında yoğunluk', 'İçeriklerin gün ve saate göre gösterilme yoğunluğu (koyu renk daha yoğun).', pk.v ? `<div class="heat"><div></div>${Array.from({ length: 24 }, (_, h) => `<span class="hl">${h % 3 === 0 ? h : ''}</span>`).join('')}${j.heat.map((row, d) => `<span class="dn">${wds(d)}</span>${row.map((v, h) => `<i title="${wd(d)} ${hh(h)}: ${v}" style="background:rgba(var(--a2),${v ? (0.12 + v / hmax * 0.88).toFixed(2) : 0.04})"></i>`).join('')}`).join('')}</div>` : '<div class="empty">Henüz veri yok. Ekran açık kaldıkça burada görünür.</div>')
    + `<div class="grid2">` + card('Kesintiler', 'Ekranın internet bağlantısı 2 dakikadan uzun koptuğunda sayılır.', j.totals.drops ? `<div class="scroll"><table><thead><tr><th>Gün</th><th class="num">Kesinti</th><th class="num">Toplam süre</th></tr></thead><tbody>${j.daily.filter(d => d.drops).reverse().slice(0, 14).map(d => `<tr><td>${fmtD(d.day)}</td><td class="num">${d.drops}</td><td class="num">${dur(d.dropsec)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Bu dönemde kesinti olmadı.</div>')
    + card('Özel kartlar', 'Ekranlarda kaç kez gösterildi.', `<div class="stats" style="grid-template-columns:repeat(3,1fr);margin:0">${stat(nf(j.shown.camp), 'Kampanya kartı')}${stat(nf(j.shown.big), 'Büyük maç kartı')}${stat(nf(j.shown.goal), 'Gol bildirimi')}</div>`) + `</div>`
    + card('İçerikler', 'En çok oynayandan aza.', j.items.length ? `<div class="scroll"><table><thead><tr><th>İçerik</th><th>Tür</th><th class="num">Oynatma</th><th class="num">Toplam süre</th><th>Son</th></tr></thead><tbody>${j.items.slice(0, 30).map(it => `<tr><td>${esc(it.name)}</td><td>${esc({ video: 'Video', image: 'Fotoğraf', poster: 'Afiş', instagram: 'Instagram', trailer: 'Fragman' }[it.type] || it.type || '—')}</td><td class="num">${nf(it.plays)}</td><td class="num">${it.sec ? dur(it.sec) : '—'}</td><td>${fmtD(it.last)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Henüz veri yok. Ekran açık kaldıkça burada görünür.</div>');
}

async function load() {
  D = await api('GET', '/overview');
  const first = !$('main').dataset.ready;
  if (first) { $('main').dataset.ready = '1'; render(); return; }
  drawNav();
  // form içeren sayfalar yeniden çizilmez (yazdıklarınız silinmesin); yalnız canlı bölümler tazelenir
  if (page === 'home') { $('main').innerHTML = PAGES.home.html(); PAGES.home.after(); }
  else if (page === 'tenants') drawRows();
  else if (page === 'sources') liveSources();
  else if (page === 'backup') PAGES.backup.after();
}
load(); setInterval(load, 30000);
