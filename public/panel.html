.t-matchday i:nth-child(1),.t-matchday i:nth-child(2){top:24%;width:24%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid #ffe08a;box-shadow:0 0 8px rgba(255,215,120,.65)}.t-matchday i:nth-child(1){left:10%}.t-matchday i:nth-child(2){right:10%}

#modal .mb:has(.bpv){max-width:1100px;width:96vw}
.bpv{display:flex;flex-direction:column;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.spsum{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;padding:11px 16px;margin-bottom:14px;border-radius:var(--r-m);background:var(--panel2);font-size:13.5px;color:var(--soft)}.spsum b{color:var(--text);font-size:15px}
.lgrp{border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:10px;padding:0 14px}.lgrp summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:14px}.lgrp summary::-webkit-details-marker{display:none}.lgrp summary:before{content:'›';display:inline-block;width:16px;color:var(--mute);transition:transform .15s}.lgrp[open] summary:before{transform:rotate(90deg)}.lgrp summary b{flex:1}.lgrp .cnt{font-size:12px;color:var(--accent2);font-weight:700}.lgrp .chips{padding-bottom:14px}
.adv{border:1px solid var(--line);border-radius:var(--r-m);padding:0 14px 14px}.adv summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:600}.adv .f{margin-top:0}
#nav .sep{height:1px;background:var(--line);margin:8px 6px}
#sidefoot{border-top:1px solid var(--line);padding:10px 0 0}
.acct{position:relative}
.acct>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:var(--r-m);padding:9px 12px;color:var(--soft);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:start}
.acct>button:hover,.acct.on>button{background:rgba(255,255,255,.05);color:#fff}
.acct>button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acctm{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-m);padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:60}
.acct.on .acctm{display:block}
.acctm a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);color:var(--soft);text-decoration:none;font-size:14px}
.acctm a:hover{background:rgba(255,255,255,.06);color:#fff}
.acctl{padding:6px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0}
.acctl .lsel,.acctl .lsel>button{width:100%}.acctl .lsel>button span{flex:1;text-align:start}
#top{display:none}
main{flex:1;min-width:0;padding:28px 36px 90px}
.wrap{max-width:1180px;margin:0 auto}
#banner{margin-bottom:18px}
.bn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-m);font-size:14px;margin-bottom:10px}
.bn.trial{background:rgba(var(--a2),.1);border:1px solid rgba(var(--a2),.35)}
.bn.bad{background:rgba(239,91,79,.1);border:1px solid rgba(239,91,79,.4)}
#impbar{position:sticky;top:0;z-index:90;height:32px;display:flex;align-items:center;justify-content:center;gap:14px;background:var(--accent);color:#fff;font-size:13px;padding:0 12px}
#impbar button{background:rgba(0,0,0,.25);border:0;color:#fff;font:inherit;font-weight:700;border-radius:var(--r-pill);padding:3px 12px;cursor:pointer}#impbar button:hover{background:rgba(0,0,0,.4)}
body.imp #side{top:32px;height:calc(100vh - 32px)}body.imp .jump{top:32px}body.imp .mbulk{top:90px}

.bn.lock{background:rgba(var(--a2),.08);border:1px dashed rgba(var(--a2),.45)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
.head p{color:var(--mute);margin-top:4px;max-width:720px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:var(--r-m);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:var(--r-s);color:var(--mute);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--panel3);color:#fff}
/* ===== kartlar ===== */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
[hidden]{display:none!important}
.qi{display:flex;flex-direction:column;background:var(--panel2);border-radius:var(--r-m)}.qi>.it{background:none}.qi .qr{width:54px;height:54px;background:#fff;border-radius:var(--r-s);padding:3px;flex:none}.qi .qr svg{width:100%;height:100%;display:block}.qh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 14px 12px}
.qprev{display:flex;align-items:center;gap:12px;min-height:40px}

.qprev .qr svg{width:100%;height:100%;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;min-width:0}
.jump{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-6px -4px 18px;padding:10px 4px;background:linear-gradient(var(--bg) 80%,transparent)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line2);background:var(--panel);color:var(--soft);border-radius:var(--r-l);padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.jump button:hover{color:#fff;border-color:rgba(var(--a2),.7)}
.card.flash{animation:cflash 1.6s ease}
@keyframes cflash{0%,30%{box-shadow:0 0 0 2px var(--accent2),0 0 24px rgba(var(--a2),.35)}100%{box-shadow:0 0 0 0 transparent}}

.grid>.card{margin-bottom:0}
.ch{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.ch>div:first-child{flex:1;min-width:0}
.ch h3{font-size:16px;font-weight:700}
.ch p{color:var(--mute);font-size:13.5px;margin-top:3px}
.card.off>.cb{opacity:.45;pointer-events:none}
.muted{color:var(--mute);font-size:13.5px}
.sep2{border:0;border-top:1px solid var(--line);margin:16px 0}

.fl>span{font-size:12.5px;color:var(--mute);font-weight:500}

textarea{resize:vertical;min-height:80px}

.btn.g{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.g:hover{border-color:var(--accent2)}
.btn.d{background:transparent;border:1px solid rgba(239,91,79,.4);color:var(--bad)}
.btn.dz{background:var(--bad);color:#fff}.btn.dz:hover{filter:brightness(1.1)}
.btn .ic{width:16px;height:16px}
.btn.s{padding:6px 12px;font-size:13px;border-radius:var(--r-s)}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:var(--r-s)}
.sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:var(--r-pill);transition:.18s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s}
.sw input:checked+i{background:var(--accent2)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(var(--a2),.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-pill);background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:14px;user-select:none}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:rgba(var(--a2),.22);border-color:var(--accent2);color:#fff}
.chip.dim{opacity:.45;cursor:not-allowed}
.grp{margin-bottom:16px}
.grp h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);margin-bottom:9px;font-weight:700}
/* ===== listeler ===== */
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel2);border-radius:var(--r-m);min-width:0}
.it .b{flex:1;min-width:0}
.it .b b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .b span b{display:inline;font-size:inherit;white-space:normal}
.it .b span{display:block;color:var(--mute);font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);text-align:center;padding:22px;border:1px dashed var(--line2);border-radius:var(--r-m);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(62,207,116,.18)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:var(--r-l);font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(62,207,116,.35)}
.pill.bad{color:var(--bad);border-color:rgba(239,91,79,.35)}
.pill.warn{color:var(--warn);border-color:rgba(232,177,60,.35)}
.stars{color:#f5b73b;letter-spacing:1px}
/* ===== önizleme ===== */
.pv{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
/* ===== kurulum adımları ===== */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m);background:var(--panel2);text-decoration:none;color:var(--text)}
.step:hover{background:var(--panel3)}
.step .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;border:2px solid var(--line2);color:var(--mute)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#0d1a12}
.step .b{flex:1}.step .b b{display:block;font-weight:600}.step .b span{color:var(--mute);font-size:13px}
.step.done .b b{color:var(--soft)}
.stat{background:var(--panel2);border-radius:var(--r-m);padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{color:var(--mute);font-size:12.5px}
/* ===== medya ===== */
#drop{border:2px dashed rgba(var(--a2),.45);border-radius:var(--r-m);padding:30px 20px;text-align:center;cursor:pointer;background:rgba(var(--a2),.05);transition:.15s}
#drop.over,#drop:hover{background:rgba(var(--a2),.14);border-color:var(--accent2)}
#drop b{display:block;font-size:16px;margin-bottom:4px}
.up{background:var(--panel2);border-radius:var(--r-m);padding:9px 12px;font-size:13px;margin-top:8px}
.up .bar{height:6px;background:rgba(255,255,255,.1);border-radius:var(--r-s);margin-top:7px;overflow:hidden}
.up .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;cursor:grab}
.tile.dragover{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.tile .th{position:relative;aspect-ratio:16/9;background:#000;cursor:zoom-in}
.tile .th img,.tile .th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .no{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.7);border-radius:var(--r-l);min-width:24px;height:24px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tile .ty{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.7);border-radius:var(--r-l);padding:3px 9px;font-size:12px}
.tile .proc{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.tile .m{padding:9px 11px;display:flex;align-items:center;gap:6px}
.tile .m span{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .m .grip{flex:none;color:var(--mute);cursor:grab;display:flex}.tile .m .grip .ic{width:15px;height:15px}
.btn.ib{padding:5px;width:28px;height:28px}.btn.ib .ic{width:15px;height:15px}
.tile .pick{position:absolute;top:6px;left:38px;width:24px;height:24px;border-radius:var(--r-s);background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--t-fast);cursor:pointer}
.tile .pick input{width:15px;height:15px;accent-color:var(--accent2);cursor:pointer;margin:0}
.tile:hover .pick,.tile.picked .pick,.mgrid:has(.picked) .pick{opacity:1}
.tile.picked{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2)}
.tile.gone{display:none}
.mbulk{position:sticky;top:58px;z-index:19;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border-radius:var(--r-m);background:var(--panel3);border:1px solid rgba(var(--a2),.5)}
#popm{position:fixed;z-index:80;display:none;min-width:200px;padding:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-m);box-shadow:0 14px 34px rgba(0,0,0,.5)}
#popm.on{display:block}
#popm button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--soft);font:inherit;font-size:14px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;text-align:start}
#popm button:hover{background:rgba(255,255,255,.06);color:#fff}#popm button.dz{color:var(--bad)}#popm button.dz:hover{background:rgba(239,91,79,.12)}
#popm hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.meter{height:8px;border-radius:var(--r-s);background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* ===== düzen editörü ===== */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tpl{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;cursor:pointer;text-align:left}
.tpl:hover{border-color:var(--accent2)}
.tpl .mini{position:relative;aspect-ratio:16/9;background:#0c0e0e;border-radius:var(--r-s);margin-bottom:8px;overflow:hidden}
.tpl .mini i{position:absolute;background:rgba(var(--a2),.3);border:1px solid rgba(var(--a2),.7);border-radius:4px}
.tpl b{font-size:13.5px;display:block}
.tpl span{font-size:12px;color:var(--mute)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
#cw{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r-m);background:#0b0d0d;border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none}
#cv{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:calc(100% / 24) calc(100% / 24)}
.wb{position:absolute;border-radius:var(--r-s);border:1.5px solid rgba(var(--a2),.65);background:rgba(var(--a2),.15);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:grab;overflow:hidden;text-align:center;padding:4px;font-size:12px;font-weight:600;color:#fff}
.wb small{font-weight:500;color:var(--mute);font-size:12px}
.wb .ic{width:20px;height:20px;opacity:.9}
.wb.fl{z-index:2;background:rgba(var(--a2),.38);backdrop-filter:blur(2px)}
.wb.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent2);z-index:3}
.wb.bad{border-color:var(--bad);background:rgba(239,91,79,.22)}
.wb .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent2) 50%)}
#props{background:var(--panel2);border-radius:var(--r-m);padding:16px;min-height:220px}
#props h4{font-size:15px;margin-bottom:4px}
#props .fl{margin-top:10px}
.swr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.swr:last-child{border-bottom:0}
.swr .b{flex:1;min-width:0}
.swr .b b{display:block;font-weight:600;font-size:14.5px}
.swr .b span{display:block;color:var(--mute);font-size:13px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.swc{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;cursor:pointer;text-align:left}
.swc:hover,.swc.on{border-color:var(--accent2)}
.swc .c{display:flex;height:34px;border-radius:var(--r-s);overflow:hidden;margin-bottom:7px}
.swc .c i{flex:1}
.swc b{font-size:13px}
/* ===== fiyat listesi ===== */
.mcat{background:var(--panel2);border-radius:var(--r-m);padding:14px;margin-bottom:12px}
.mcat .chd{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) 110px auto;gap:8px;margin-bottom:6px;align-items:center}
.mrow input{padding:8px 10px}
.mrow.hp{grid-template-columns:minmax(0,2fr) minmax(0,2fr) 110px 96px auto}
.mrow .mhp{border-style:dashed;color:var(--accent2)}
.flow{display:grid;gap:6px}.flow .fr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.flow .fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .ft{position:relative;display:grid;grid-template-columns:repeat(48,1fr);gap:1px;height:18px;border-radius:4px;overflow:hidden;background:rgba(127,127,127,.12)}
.flow .ft i{background:transparent}.flow .ft i.on{background:rgba(var(--a2),.85)}.flow .ft i.hp{background:var(--warn)}
.flow .ft b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text,#fff);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.flow .fh{position:relative;height:14px;font-size:12px;color:var(--mute,#888)}.flow .fh span{position:absolute;transform:translateX(-50%)}
.flow .fh span:first-child{transform:none}.flow .fh span:last-child{transform:translateX(-100%)}
/* ===== diğer ===== */
.qr{width:64px;height:64px;background:#fff;border-radius:var(--r-s);padding:3px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative;width:86px;height:58px;border-radius:var(--r-s);overflow:hidden;background:#000}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-size:12px;line-height:1}
.time{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 7px 6px 14px;font-weight:600}
.time button{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plans>div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;font-size:13.5px;line-height:1.7}
.plans>div.cur{border-color:var(--accent2)}
.plans b{display:block;font-size:16px;margin-bottom:4px}
.geo{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.geo button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;cursor:pointer}
.geo button:hover{border-color:var(--accent2)}
.geo button.on{border-color:var(--accent2);font-weight:600}
.code-in{font-size:22px!important;letter-spacing:.2em;font-weight:700;text-align:center;max-width:220px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .mb{max-width:min(1100px,94vw);max-height:88vh;display:flex;flex-direction:column;gap:10px;align-items:center}
#modal video,#modal img{max-width:100%;max-height:80vh;border-radius:var(--r-m);background:#000}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(420px,calc(100vw - 36px))}
.toast{background:#2a2f2f;border:1px solid var(--line2);border-left:4px solid var(--ok);padding:12px 16px;border-radius:var(--r-m);font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .2s}
.toast.err{border-left-color:var(--bad)}
.toast.undo{display:flex;align-items:center;gap:14px;border-left-color:var(--accent2)}.toast.undo span{flex:1}.toast.undo button{background:none;border:0;color:var(--accent2);font:inherit;font-weight:700;cursor:pointer;padding:0}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.toast small{display:block;margin-top:3px;font-size:12.5px;color:var(--soft)}
/* ortak kayıt çubuğu (A2) */
#savebar{position:fixed;left:calc(50% + 124px);bottom:18px;transform:translate(-50%,140%);z-index:65;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;background:var(--panel3);border:1px solid rgba(var(--a2),.55);border-radius:var(--r-l);box-shadow:0 16px 40px rgba(0,0,0,.55);transition:transform .25s;max-width:calc(100vw - 32px)}
#savebar.on{transform:translate(-50%,0)}
#savebar span{font-size:14px;font-weight:600;margin-inline-end:8px;white-space:nowrap}
body.sbon #toasts{bottom:86px}
@media(max-width:900px){#savebar{left:50%}#savebar span{white-space:normal;font-size:13px}}
/* durum etiketi (A7) */
.stp{display:inline-flex;align-items:center;margin-inline-start:10px;padding:2px 9px;border-radius:var(--r-pill);font-size:12px;font-weight:700;vertical-align:2px;background:rgba(255,255,255,.08);color:var(--mute)}
.stp.on{background:rgba(62,207,116,.15);color:var(--ok)}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:6px}
.card.swoff>.cb{opacity:.55}
.card.dirty{border-color:rgba(var(--a2),.45)}
/* özet: kurulum tamam (A8) */
.okline{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.devl{text-decoration:none;color:var(--text)}.devl:hover{background:var(--panel3)}.devl>.ic{color:var(--mute)}
/* başlangıç paketleri katlanır (A9) */
details.stx{padding:0}details.stx>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:18px 22px}details.stx>summary::-webkit-details-marker{display:none}
details.stx>summary b{font-size:16px}details.stx>summary::before{content:'›';color:var(--accent2);font-weight:700;transition:transform var(--t-fast)}details.stx[open]>summary::before{transform:rotate(90deg)}
details.stx>.card{border:0;background:none;margin:0;padding:0 22px 20px}details.stx>.card>.ch{display:none}
.loading{color:var(--mute);padding:40px;text-align:center}
/* ===== telefon ===== */
@media(max-width:1100px){.editor{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #app.menu #side{transform:none}
  #shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  #app.menu #shade{display:block}
  #top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:rgba(18,20,20,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
  #top button{background:none;border:1px solid var(--line2);border-radius:var(--r-s);width:40px;height:40px;font-size:18px;cursor:pointer}
  #top b{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app{flex-direction:column}
  main{padding:18px 14px 90px}
  .g2,.g3{grid-template-columns:1fr}
  .head h1{font-size:23px}
  .card{padding:16px}
  .mrow{grid-template-columns:1fr 90px auto}.mrow .md{display:none}.mrow.hp{grid-template-columns:1fr 80px 80px auto}.flow .fr{grid-template-columns:90px 1fr}
  .plans{grid-template-columns:1fr}
}
/* ===== yeni bölümler: afiş, zamanlama, istatistik, şube ===== */
.pmini{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#000}
.tile .th .pmini{position:absolute;inset:0;aspect-ratio:auto}
.tile .th.off{opacity:.45}
.tile .sch{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.75);border-radius:var(--r-l);padding:3px 9px;font-size:12px;max-width:calc(100% - 14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ty .tyd{font-style:normal;opacity:.8}
.tile .sch,.tile .hid{display:inline-flex;align-items:center;gap:4px}.tile .sch{color:var(--warn)}.tile .sch .ic,.tile .hid .ic{width:13px;height:13px}
.tile .hid{position:absolute;bottom:7px;right:7px;display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.78);color:#fff;border-radius:var(--r-l);padding:3px 9px;font-size:12px;font-weight:700}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-m);padding:0 0 10px;overflow:hidden;cursor:pointer}
.pcard:hover{border-color:var(--accent2)}
.pcard b,.pcard span{padding:0 11px}
.ped{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.ped .fl{margin-bottom:10px}
.pv16{position:relative;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#000;margin-bottom:6px}
#modal .mb:has(.ped){max-width:980px;width:96vw;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 22px;overflow:auto;align-items:stretch}
.stu-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;border:2px dashed var(--line2);border-radius:var(--r-m);cursor:pointer;text-align:center;padding:20px}
.stu-drop b{font-size:18px}.stu-drop:hover,.stu-drop.over{border-color:var(--accent2);background:rgba(var(--a2),.06)}

.ytm-head .ytm-btn.w{height:40px;padding:0 22px;border-radius:20px;font-size:15px}
.ytm-tracks{display:flex;flex-direction:column}
.ytm-tr{display:grid;grid-template-columns:56px minmax(0,1.4fr) minmax(0,1fr) 64px auto;align-items:center;gap:14px;min-height:56px;padding:4px 8px;border-bottom:1px solid var(--y-ln);border-radius:4px}
.ytm-tr:hover{background:var(--y-hv)}.ytm-tr.on{background:rgba(255,255,255,.14)}
.ytm-tth{all:unset;position:relative;width:40px;height:40px;border-radius:2px;overflow:hidden;background:var(--y-s2);cursor:pointer;justify-self:center}
.ytm-tth img{width:100%;height:100%;object-fit:cover;display:block}.ytm-tth i{display:block;width:100%;height:100%}
.ytm-tth span{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
.ytm-tr:hover .ytm-tth span{opacity:1}.ytm-tth .meq{left:4px;bottom:4px;right:auto}
.ytm-tb{all:unset;min-width:0;cursor:pointer}
.ytm-tb b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytm-tb .m{display:none;color:var(--y-t2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytm-ta{color:var(--y-t2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytm-td{color:var(--y-t2);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.ytm-tx{display:flex;gap:2px;justify-content:flex-end;min-width:34px}
.ytm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 20px;color:var(--y-t2)}
.ytm-empty>.ic{width:44px;height:44px;color:var(--y-t3)}.ytm-empty b{color:#fff;font-size:18px;font-weight:500}.ytm-empty .row{margin-top:10px;gap:10px;justify-content:center}
.ytm-empty.sm{padding:24px 8px;font-size:14px;align-items:flex-start;text-align:left}.ytm-empty a{color:#fff}
.ytm-warn{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 16px;border-radius:8px;background:var(--y-s1);color:#e0e0e0;font-size:14px;line-height:1.45}
.ytm-warn>.ic{flex:none;color:var(--warn)}.ytm-warn span{flex:1}
.ytm-draft{margin:8px 0 36px;padding:20px;border-radius:12px;background:var(--y-s1)}
.ytm-draft .row{margin-top:14px;gap:10px}
.ytm-in{width:100%;height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:var(--y-bg);color:#fff;font:inherit;font-size:15px;margin:0 0 10px}
.ytm-in:focus{outline:0;border-color:rgba(255,255,255,.5)}
.ytm-accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;margin-bottom:20px}
.ytm-acc{padding:20px;border-radius:12px;background:var(--y-s1);margin-bottom:20px}.ytm-accs .ytm-acc{margin:0}
.ytm-acc .h{display:flex;align-items:center;gap:12px;margin:0 0 12px}.ytm-acc .h h2{flex:1;margin:0;font-size:20px;font-weight:700}
.ytm-acc .lg{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1)}
.ytm-acc.yt .lg{background:rgba(255,48,64,.18);color:#ff5c6c}.ytm-acc.sp .lg{background:rgba(30,215,96,.16);color:#1ed760}
.ytm-acc .row{gap:10px;margin-top:12px}.ytm-acc .swr{border-color:var(--y-ln)}.ytm-acc .swr span{color:var(--y-t2)}
.ytm-muted{color:var(--y-t2);font-size:14px;line-height:1.5;margin:0 0 12px}.ytm-muted .ic{width:16px;height:16px;margin-right:4px}
.ytm-ok{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px;font-size:14px;color:#e0e0e0}.ytm-ok .ic{color:var(--ok)}
.ytm-devs{display:flex;flex-direction:column;gap:6px}
.ytm-dev{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--y-ln);background:none;color:#fff;text-align:start;cursor:pointer}
.ytm-dev:hover{background:var(--y-hv)}.ytm-dev.on{border-color:#1ed760;background:rgba(30,215,96,.08)}
.ytm-dev .i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);flex:none}
.ytm-dev .t{flex:1;min-width:0}.ytm-dev b{display:block;font-size:15px;font-weight:500}.ytm-dev .t span{display:block;color:var(--y-t2);font-size:13px}
.ytm-dev>.ic{color:#1ed760}
.ytm-add{display:grid;grid-template-columns:2fr 1fr;gap:10px}

.ytm-flow{margin:0 0 40px;--sv:#ff4e5f}.ytm-flow.sp{--sv:#1ed760}
.ytm-flow .ytm-sh h2{display:flex;align-items:center;gap:10px}.ytm-flow .ytm-sh h2::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--sv)}
.ytm-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;counter-reset:s}
.ytm-steps li{position:relative;padding:14px 14px 16px;border-radius:12px;background:var(--y-s1)}
.ytm-steps li:not(:last-child)::after{content:'';position:absolute;right:-13px;top:62px;width:10px;height:10px;border-top:2px solid var(--y-t3);border-right:2px solid var(--y-t3);transform:rotate(45deg);z-index:1}
.ytm-steps .ill{aspect-ratio:16/10;border-radius:8px;background:var(--y-bg);display:grid;place-items:center;margin-bottom:12px}
.ytm-steps .ill svg{width:100%;height:100%}
.ytm-steps .n{position:absolute;top:22px;left:22px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sv);color:#030303;font-weight:700;font-size:14px}
.ytm-steps b{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
.ytm-steps p{margin:0;color:var(--y-t2);font-size:13.5px;line-height:1.5}
/* alt çalar çubuğu */
.ytm-bar{position:fixed;left:248px;right:0;bottom:0;z-index:40;height:72px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;padding:0 20px;background:#212121;color:#fff;font-family:Roboto,'Segoe UI',Arial,sans-serif;box-shadow:0 -1px 0 rgba(255,255,255,.08)}

.ytm-prog{position:absolute;left:0;top:-2px;height:2px;background:#f00;max-width:100%}
.ytm-bar-ctl{display:flex;align-items:center;gap:6px}
.ytm-bar-ctl button{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:none;color:#fff;cursor:pointer}
.ytm-bar-ctl button:hover{background:rgba(255,255,255,.1)}.ytm-bar-ctl .ic{width:22px;height:22px}
.ytm-bar-ctl .big{width:48px;height:48px}.ytm-bar-ctl .big .ic{width:30px;height:30px}
.ytm-bar-np{all:unset;display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer;justify-self:center;max-width:520px;width:100%}
.ytm-bar-np .c{width:40px;height:40px;border-radius:2px;overflow:hidden;background:#3a3a3a;display:grid;place-items:center;flex:none}
.ytm-bar-np .c img{width:100%;height:100%;object-fit:cover}.ytm-bar-np .c .ic{width:20px;height:20px;color:#aaa}
.ytm-bar-np .t{min-width:0}.ytm-bar-np b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytm-bar-np .t>span{display:block;color:#aaa;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ytm-bar-r{display:flex;align-items:center;gap:14px}
.ytm-vol{display:flex;align-items:center;gap:8px;color:#aaa}.ytm-vol .ic{width:22px;height:22px}
.ytm-vol input{width:110px;accent-color:#fff}
body.imp .ytm-top{top:32px}body.imp .ytm-chips{top:96px}
@media(max-width:900px){
  .ytm{padding:0 0 150px}
  .ytm-top{margin:-8px -14px 0;padding:10px 14px 8px;top:56px}.ytm-chips{top:114px;margin:0 -14px 6px;padding:4px 14px 12px}
  .ytm-sh h2{font-size:22px}.ytm-row{grid-auto-columns:144px;gap:14px}.ytm-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .ytm-hero{gap:14px;padding:14px}.ytm-hero .c{width:88px;height:88px}.ytm-hero h2{font-size:20px}
  .ytm-head{flex-direction:column;align-items:flex-start;gap:18px}.ytm-head .c{width:200px;height:200px;align-self:center}.ytm-head h1{font-size:26px}
  .ytm-tr{grid-template-columns:48px minmax(0,1fr) auto;gap:10px}.ytm-ta,.ytm-td{display:none}.ytm-tb .m{display:block}
  .ytm-cplay{opacity:1;transform:none;width:36px;height:36px;right:8px;bottom:8px}
  .ytm-add{grid-template-columns:1fr}.ytm-accs{grid-template-columns:1fr}
  .ytm-steps{grid-template-columns:1fr;gap:10px}.ytm-steps li::after{display:none}
  .ytm-steps li{display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:14px;padding:12px}
  .ytm-steps .ill{grid-row:1/3;margin:0;align-self:start}.ytm-steps .n{top:16px;left:16px;width:22px;height:22px;font-size:12px}.ytm-steps b{font-size:15px;margin:2px 0 4px}
  .ytm-bar{left:0;height:64px;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;padding:0 8px 0 10px}
  .ytm-bar-np{order:1;justify-self:stretch;gap:10px}.ytm-bar-ctl{order:2;gap:0}.ytm-bar-ctl button{width:38px;height:38px}.ytm-bar-ctl .big{width:44px;height:44px}
  .ytm-bar-r{order:3}.ytm-vol{display:none}
}
