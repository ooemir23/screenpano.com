<html lang="tr"><head><meta charset="utf-8"><script src="/i18n.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Panel</title>
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/montserrat-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F}
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/montserrat-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212}
:root{--bg:#121414;--side:#0d0f0f;--panel:#1b1e1e;--panel2:#232727;--panel3:#2a2f2f;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f2efe9;--soft:#c9c6c0;--mute:#8d9393;--accent:#906538;--accent2:#c9955c;--a2:201,149,92;--ok:#3ecf74;--warn:#e8b13c;--bad:#ef5b4f;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:.92em}
/* ===== yerleşim ===== */
#app{display:flex;min-height:100vh}
#side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px}
#brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px;min-height:58px}
#brand img{max-height:44px;max-width:100%;object-fit:contain}
#brand b{font-size:17px;font-weight:800;line-height:1.2}
#nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
#nav a{display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:10px;color:var(--soft);text-decoration:none;font-weight:500;font-size:14.5px}
#nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
#nav a.on{background:linear-gradient(90deg,rgba(var(--a2),.22),rgba(var(--a2),.06));color:#fff}
#nav a .i{width:22px;text-align:center;font-size:17px}
#nav a .pro{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:9px;background:rgba(var(--a2),.18);color:var(--accent2)}
#nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute,#8a9090);padding:10px 12px 2px}
#nav .grp:first-child{padding-top:2px}
.att{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;background:var(--panel2);text-decoration:none;color:var(--text);margin-bottom:8px;border-left:3px solid #e9b44c}
.att.bad{border-left-color:#ee5b4f}.att .b{flex:1;min-width:0;font-size:14px}.att .b span{display:block;color:var(--soft);font-size:12.5px;margin-top:2px}.att .b span span{display:inline}
.card.mb{margin-bottom:18px}
.bstyles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ibg{display:flex;align-items:center;gap:16px}.ibg input[type=range]{flex:1;accent-color:var(--accent2)}.ibg b{min-width:56px;text-align:right;font-size:18px;color:var(--accent2)}
.ibgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:18px}
.ibc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,opacity .15s}.ibc:hover{border-color:var(--line2)}.ibc.off{opacity:.55}
.ibh{display:flex;align-items:flex-start;gap:12px}.ibh .b{flex:1;min-width:0}.ibh .b b{display:block;font-size:15px}.ibh .b span{display:block;font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:2px}
.ibi{flex:none;width:38px;height:38px;border-radius:11px;background:rgba(var(--a2),.14);display:flex;align-items:center;justify-content:center;font-size:19px}
.ibb{display:flex;gap:10px;flex-wrap:wrap}.ibb:empty{display:none}.ibf{flex:1;min-width:140px;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
.ibn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px}.ibn input{flex:1;min-width:0;width:100%;background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;color:var(--text);font:inherit;font-size:15px;font-weight:600;padding:9px 0!important;outline:0}.ibn em{font-style:normal;font-size:12px;color:var(--mute)}.ibn:focus-within{border-color:var(--accent2)}
.ibx{border-top:1px solid var(--line);padding-top:10px}.ibx summary{cursor:pointer;font-size:13px;color:var(--soft);list-style:none}.ibx summary::-webkit-details-marker{display:none}.ibx summary::before{content:'▸ ';color:var(--accent2)}.ibx[open] summary::before{content:'▾ '}.ibx>div{margin-top:10px}
.bsty{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit}
.bsty:hover{border-color:var(--accent2)}.bsty.on{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
.bsty b{font-size:14px;margin-top:6px}.bsty b em{font-style:normal;font-size:11px;color:var(--accent2);margin-left:4px}.bsty>span:last-child{font-size:12px;color:var(--mute);line-height:1.4}
.bth{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0a0a0c}
.bth i{position:absolute;display:block}
.t-uyum{background:linear-gradient(160deg,#a90432,#0a0a0c 120%)}.t-uyum:before{content:"";position:absolute;inset:0;background:linear-gradient(200deg,#0d2a6e,#0a0a0c 120%);clip-path:polygon(57% 0,100% 0,100% 100%,43% 100%)}
.t-uyum i:nth-child(1){left:12%;top:28%;width:22%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25)}.t-uyum i:nth-child(2){right:12%;top:28%;width:22%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.25)}
.t-uyum i:nth-child(3){bottom:0;left:0;right:0;height:10%;background:rgba(0,0,0,.7);border-top:2px solid #f4c04f;border-radius:0}
.t-stadyum{background:linear-gradient(120deg,#a90432 0 50%,#0d2a6e 50%)}.t-stadyum:before{content:"";position:absolute;inset:0;background:conic-gradient(from 180deg at 50% 0,transparent 0 160deg,rgba(255,255,255,.3) 170deg,transparent 180deg,rgba(255,255,255,.25) 190deg,transparent 200deg),radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.7))}
.t-stadyum i:nth-child(1),.t-stadyum i:nth-child(2){top:30%;width:20%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 14px rgba(255,255,255,.4)}.t-stadyum i:nth-child(1){left:14%}.t-stadyum i:nth-child(2){right:14%}.t-stadyum i:nth-child(3){left:43%;right:43%;top:40%;height:16%;background:#fff;border-radius:2px}
.t-bant{background:linear-gradient(135deg,#3a4a3a,#1f2a33)}.t-bant i:nth-child(1){left:6%;right:6%;bottom:22%;height:20%;background:linear-gradient(90deg,#a90432 0 42%,#111 42% 58%,#0d2a6e 58%);border-left:0}.t-bant i:nth-child(2){left:6%;width:28%;bottom:42%;height:8%;background:#f4c04f}.t-bant i:nth-child(3){left:6%;right:6%;bottom:13%;height:9%;background:#0b0b0f;border-top:2px solid #f4c04f}
.t-sayac{background:radial-gradient(ellipse 55% 85% at 12% 45%,rgba(201,8,42,.9),rgba(255,184,0,.4) 45%,transparent 72%),radial-gradient(ellipse 55% 85% at 88% 45%,rgba(18,54,144,.9),rgba(255,221,0,.4) 45%,transparent 72%),#07080b}.t-sayac i:nth-child(1),.t-sayac i:nth-child(2){top:18%;width:24%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:0 0 10px rgba(255,200,80,.75)}.t-sayac i:nth-child(1){left:10%;border:2px solid #ffb800}.t-sayac i:nth-child(2){right:10%;border:2px solid #ffdd00}.t-sayac i:nth-child(3){left:24%;right:24%;bottom:14%;height:22%;background:linear-gradient(#262832 0 50%,#16171e 50%);border-radius:4px;border:1px solid rgba(255,215,120,.45)}
.t-poster{background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px),linear-gradient(115deg,#5c0220 0 50%,#091c4a 50%)}.t-poster:before{content:"";position:absolute;inset:6%;border:1px solid rgba(244,192,79,.8);outline:1px solid rgba(244,192,79,.35);outline-offset:-4px}
.t-poster i:nth-child(1){left:22%;right:22%;top:26%;height:14%;background:#fff;border-radius:2px}.t-poster i:nth-child(2){left:26%;right:26%;top:48%;height:14%;background:#fff;border-radius:2px}.t-poster i:nth-child(3){left:30%;right:30%;bottom:16%;height:4%;background:#f4c04f}
.t-duello,.t-turnuva{background:radial-gradient(ellipse 45% 75% at 12% 70%,rgba(200,60,30,.85),transparent 70%),radial-gradient(ellipse 45% 75% at 88% 70%,rgba(40,70,160,.85),transparent 70%),radial-gradient(ellipse 25% 60% at 50% 55%,rgba(255,180,80,.45),transparent 70%),#0a0705}
.t-duello i:nth-child(1),.t-duello i:nth-child(2),.t-turnuva i:nth-child(1),.t-turnuva i:nth-child(2){bottom:0;width:30%;height:78%;background:radial-gradient(circle at 50% 18%,#1a1310 0 15%,transparent 16%),radial-gradient(ellipse 50% 45% at 50% 85%,#1a1310 0 98%,transparent 100%)}.t-duello i:nth-child(1),.t-turnuva i:nth-child(1){left:6%}.t-duello i:nth-child(2),.t-turnuva i:nth-child(2){right:6%}
.t-duello i:nth-child(3),.t-turnuva i:nth-child(3){left:42%;top:12%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 35%,rgba(255,207,110,.88) 72%);box-shadow:0 0 10px rgba(255,207,110,.9);border:1.5px solid #ffcf6e}
.t-arena{background:radial-gradient(ellipse 65% 45% at 50% 0%,rgba(255,210,110,.45),transparent 70%),radial-gradient(ellipse 48% 75% at 15% 52%,rgba(201,8,42,.85),transparent 68%),radial-gradient(ellipse 48% 75% at 85% 52%,rgba(18,54,144,.85),transparent 68%),#040711}
.t-arena i:nth-child(1),.t-arena i:nth-child(2){top:24%;width:25%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(10,14,26,.9));border:2px solid #ffd478;box-shadow:0 6px 14px rgba(0,0,0,.75),0 0 10px rgba(255,212,120,.55)}.t-arena i:nth-child(1){left:9%}.t-arena i:nth-child(2){right:9%}
.t-arena i:nth-child(3){left:41%;top:28%;width:18%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe8a3 20%,#1e2638 65%,#070a12 100%);border:2px solid #ffd478;box-shadow:0 0 12px rgba(255,205,100,.95)}
.t-matchday{background:linear-gradient(to top,rgba(24,95,32,.85) 0%,transparent 38%),radial-gradient(circle at 18% 45%,rgba(201,8,42,.88),transparent 58%),radial-gradient(circle at 82% 45%,rgba(18,54,144,.88),transparent 58%),#05080c}
.t-matchday i:nth-child(1),.t-matchday i:nth-child(2){top:24%;width:24%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid #ffe08a;box-shadow:0 0 8px rgba(255,215,120,.65)}.t-matchday i:nth-child(1){left:10%}.t-matchday i:nth-child(2){right:10%}
.t-matchday i:nth-child(3){left:14%;right:14%;bottom:14%;height:14%;background:linear-gradient(90deg,#c9082a,#141a28 50%,#123690);border-top:1.5px solid #ffe08a;border-bottom:1.5px solid #d49424}
.t-neonarena{background:radial-gradient(circle at 15% 50%,rgba(201,8,42,.75),transparent 60%),radial-gradient(circle at 85% 50%,rgba(18,54,144,.75),transparent 60%),#060913}
.t-neonarena i:nth-child(1),.t-neonarena i:nth-child(2){top:22%;width:25%;aspect-ratio:1;background:rgba(14,20,36,.85);border:1.5px solid #ffd478;clip-path:polygon(15% 0%,85% 0%,100% 15%,100% 85%,85% 100%,15% 100%,0% 85%,0% 15%)}.t-neonarena i:nth-child(1){left:9%;border-color:#ffb800}.t-neonarena i:nth-child(2){right:9%;border-color:#29a8ff}
.t-neonarena i:nth-child(3){left:32%;right:32%;top:10%;height:11%;background:#0c111e;border:1px solid rgba(255,255,255,.35)}
#modal .mb:has(.bpv){max-width:1100px;width:96vw}
.bpv{display:flex;flex-direction:column;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.spsum{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;padding:11px 16px;margin-bottom:14px;border-radius:12px;background:var(--panel2);font-size:13.5px;color:var(--soft)}.spsum b{color:var(--text);font-size:15px}
.lgrp{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 14px}.lgrp summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:14px}.lgrp summary::-webkit-details-marker{display:none}.lgrp summary:before{content:'›';display:inline-block;width:16px;color:var(--mute);transition:transform .15s}.lgrp[open] summary:before{transform:rotate(90deg)}.lgrp summary b{flex:1}.lgrp .cnt{font-size:12px;color:var(--accent2);font-weight:700}.lgrp .chips{padding-bottom:14px}
.adv{border:1px solid var(--line);border-radius:12px;padding:0 14px 14px}.adv summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:600}.adv .f{margin-top:0}
#nav .sep{height:1px;background:var(--line);margin:8px 6px}
#sidefoot{border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
#sidefoot a{color:var(--mute);text-decoration:none}#sidefoot a:hover{color:var(--text)}
#top{display:none}
main{flex:1;min-width:0;padding:28px 36px 90px}
.wrap{max-width:1180px;margin:0 auto}
#banner{margin-bottom:18px}
.bn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:10px}
.bn.trial{background:rgba(var(--a2),.1);border:1px solid rgba(var(--a2),.35)}
.bn.bad{background:rgba(239,91,79,.1);border:1px solid rgba(239,91,79,.4)}
.bn.imp{background:rgba(90,150,255,.1);border:1px solid rgba(90,150,255,.4)}
.bn.lock{background:rgba(var(--a2),.08);border:1px dashed rgba(var(--a2),.45)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
.head p{color:var(--mute);margin-top:4px;max-width:720px}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:9px;color:var(--mute);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--panel3);color:#fff}
/* ===== kartlar ===== */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
[hidden]{display:none!important}
.qi{display:flex;flex-direction:column;background:var(--panel2);border-radius:11px}.qi>.it{background:none}.qi .qr{width:54px;height:54px;background:#fff;border-radius:8px;padding:3px;flex:none}.qi .qr svg{width:100%;height:100%;display:block}.qh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 14px 12px}
.qprev{display:flex;align-items:center;gap:12px;min-height:40px}
.qprev .qr{width:110px;height:110px;background:#fff;border-radius:10px;padding:6px;flex:none}
.qprev .qr svg{width:100%;height:100%;display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;min-width:0}
.jump{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-6px -4px 18px;padding:10px 4px;background:linear-gradient(var(--bg) 80%,transparent)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line2);background:var(--panel);color:var(--soft);border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.jump button:hover{color:#fff;border-color:rgba(var(--a2),.7)}
.card.flash{animation:cflash 1.6s ease}
@keyframes cflash{0%,30%{box-shadow:0 0 0 2px var(--accent2),0 0 24px rgba(var(--a2),.35)}100%{box-shadow:0 0 0 0 transparent}}
@media(max-width:900px){.jump{top:61px}}
.grid>.card{margin-bottom:0}
.ch{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.ch>div:first-child{flex:1;min-width:0}
.ch h3{font-size:16px;font-weight:700}
.ch p{color:var(--mute);font-size:13.5px;margin-top:3px}
.card.off>.cb{opacity:.45;pointer-events:none}
.muted{color:var(--mute);font-size:13.5px}
.sep2{border:0;border-top:1px solid var(--line);margin:16px 0}
/* ===== form ===== */
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px;align-items:end}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl>span{font-size:12.5px;color:var(--mute);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;background:#141616;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:80px}
input[type=color]{width:100%;height:44px;border:1px solid var(--line2);border-radius:10px;background:#141616;padding:4px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.mt{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap;text-decoration:none;font-size:14.5px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.g:hover{border-color:var(--accent2)}
.btn.d{background:transparent;border:1px solid rgba(239,91,79,.4);color:var(--bad)}
.btn.s{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:7px}
.sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:rgba(255,255,255,.16);border-radius:26px;transition:.18s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s}
.sw input:checked+i{background:var(--accent2)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(var(--a2),.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:30px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:14px;user-select:none}
.chip:hover{border-color:var(--accent2)}
.chip.on{background:rgba(var(--a2),.22);border-color:var(--accent2);color:#fff}
.chip.dim{opacity:.45;cursor:not-allowed}
.grp{margin-bottom:16px}
.grp h4{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);margin-bottom:9px;font-weight:700}
/* ===== listeler ===== */
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel2);border-radius:11px;min-width:0}
.it .b{flex:1;min-width:0}
.it .b b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .b span b{display:inline;font-size:inherit;white-space:normal}
.it .b span{display:block;color:var(--mute);font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);text-align:center;padding:22px;border:1px dashed var(--line2);border-radius:12px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(62,207,116,.18)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(62,207,116,.35)}
.pill.bad{color:var(--bad);border-color:rgba(239,91,79,.35)}
.pill.warn{color:var(--warn);border-color:rgba(232,177,60,.35)}
.stars{color:#f5b73b;letter-spacing:1px}
/* ===== önizleme ===== */
.pv{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
/* ===== kurulum adımları ===== */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;background:var(--panel2);text-decoration:none;color:var(--text)}
.step:hover{background:var(--panel3)}
.step .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;border:2px solid var(--line2);color:var(--mute)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#0d1a12}
.step .b{flex:1}.step .b b{display:block;font-weight:600}.step .b span{color:var(--mute);font-size:13px}
.step.done .b b{color:var(--soft)}
.stat{background:var(--panel2);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{color:var(--mute);font-size:12.5px}
/* ===== medya ===== */
#drop{border:2px dashed rgba(var(--a2),.45);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:rgba(var(--a2),.05);transition:.15s}
#drop.over,#drop:hover{background:rgba(var(--a2),.14);border-color:var(--accent2)}
#drop b{display:block;font-size:16px;margin-bottom:4px}
.up{background:var(--panel2);border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}
.up .bar{height:6px;background:rgba(255,255,255,.1);border-radius:6px;margin-top:7px;overflow:hidden}
.up .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:grab}
.tile.dragover{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.tile .th{position:relative;aspect-ratio:16/9;background:#000;cursor:zoom-in}
.tile .th img,.tile .th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .no{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.7);border-radius:20px;min-width:24px;height:24px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tile .ty{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.7);border-radius:20px;padding:3px 9px;font-size:11px}
.tile .proc{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.tile .m{padding:9px 11px;display:flex;align-items:center;gap:6px}
.tile .m span{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* ===== düzen editörü ===== */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tpl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.tpl:hover{border-color:var(--accent2)}
.tpl .mini{position:relative;aspect-ratio:16/9;background:#0c0e0e;border-radius:7px;margin-bottom:8px;overflow:hidden}
.tpl .mini i{position:absolute;background:rgba(var(--a2),.3);border:1px solid rgba(var(--a2),.7);border-radius:3px}
.tpl b{font-size:13.5px;display:block}
.tpl span{font-size:12px;color:var(--mute)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
#cw{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;background:#0b0d0d;border:1px solid var(--line);overflow:hidden;touch-action:none;user-select:none}
#cv{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:calc(100% / 24) calc(100% / 24)}
.wb{position:absolute;border-radius:8px;border:1.5px solid rgba(var(--a2),.65);background:rgba(var(--a2),.15);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;cursor:grab;overflow:hidden;text-align:center;padding:4px;font-size:12px;font-weight:600;color:#fff}
.wb small{font-weight:500;color:var(--mute);font-size:10.5px}
.wb .ic{font-size:19px;line-height:1}
.wb.fl{z-index:2;background:rgba(var(--a2),.38);backdrop-filter:blur(2px)}
.wb.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent2);z-index:3}
.wb.bad{border-color:var(--bad);background:rgba(239,91,79,.22)}
.wb .rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent2) 50%)}
#props{background:var(--panel2);border-radius:12px;padding:16px;min-height:220px}
#props h4{font-size:15px;margin-bottom:4px}
#props .fl{margin-top:10px}
.swr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.swr:last-child{border-bottom:0}
.swr .b{flex:1;min-width:0}
.swr .b b{display:block;font-weight:600;font-size:14.5px}
.swr .b span{display:block;color:var(--mute);font-size:13px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.swc{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;cursor:pointer;text-align:left}
.swc:hover,.swc.on{border-color:var(--accent2)}
.swc .c{display:flex;height:34px;border-radius:7px;overflow:hidden;margin-bottom:7px}
.swc .c i{flex:1}
.swc b{font-size:13px}
/* ===== fiyat listesi ===== */
.mcat{background:var(--panel2);border-radius:12px;padding:14px;margin-bottom:12px}
.mcat .chd{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) 110px auto;gap:8px;margin-bottom:6px;align-items:center}
.mrow input{padding:8px 10px}
.mrow.hp{grid-template-columns:minmax(0,2fr) minmax(0,2fr) 110px 96px auto}
.mrow .mhp{border-style:dashed;color:var(--accent2)}
.flow{display:grid;gap:6px}.flow .fr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.flow .fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow .ft{position:relative;display:grid;grid-template-columns:repeat(48,1fr);gap:1px;height:18px;border-radius:5px;overflow:hidden;background:rgba(127,127,127,.12)}
.flow .ft i{background:transparent}.flow .ft i.on{background:rgba(var(--a2),.85)}.flow .ft i.hp{background:var(--warn)}
.flow .ft b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text,#fff);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.flow .fh{position:relative;height:14px;font-size:11px;color:var(--mute,#888)}.flow .fh span{position:absolute;transform:translateX(-50%)}
.flow .fh span:first-child{transform:none}.flow .fh span:last-child{transform:translateX(-100%)}
/* ===== diğer ===== */
.qr{width:64px;height:64px;background:#fff;border-radius:8px;padding:3px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative;width:86px;height:58px;border-radius:7px;overflow:hidden;background:#000}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer;font-size:12px;line-height:1}
.time{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:6px 7px 6px 14px;font-weight:600}
.time button{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plans>div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.7}
.plans>div.cur{border-color:var(--accent2)}
.plans b{display:block;font-size:16px;margin-bottom:4px}
.geo{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.geo button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.geo button:hover{border-color:var(--accent2)}
.geo button.on{border-color:var(--accent2);font-weight:600}
.code-in{font-size:22px!important;letter-spacing:.2em;font-weight:700;text-align:center;max-width:220px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .mb{max-width:min(1100px,94vw);max-height:88vh;display:flex;flex-direction:column;gap:10px;align-items:center}
#modal video,#modal img{max-width:100%;max-height:80vh;border-radius:12px;background:#000}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(420px,calc(100vw - 36px))}
.toast{background:#2a2f2f;border:1px solid var(--line2);border-left:4px solid var(--ok);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tin .2s}
.toast.err{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.loading{color:var(--mute);padding:40px;text-align:center}
/* ===== telefon ===== */
@media(max-width:1100px){.editor{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #app.menu #side{transform:none}
  #shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  #app.menu #shade{display:block}
  #top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:rgba(18,20,20,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
  #top button{background:none;border:1px solid var(--line2);border-radius:9px;width:40px;height:40px;font-size:18px;cursor:pointer}
  #top b{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #app{flex-direction:column}
  main{padding:18px 14px 90px}
  .g2,.g3{grid-template-columns:1fr}
  .head h1{font-size:23px}
  .card{padding:16px}
  .mrow{grid-template-columns:1fr 90px auto}.mrow .md{display:none}.mrow.hp{grid-template-columns:1fr 80px 80px auto}.flow .fr{grid-template-columns:90px 1fr}
  .plans{grid-template-columns:1fr}
}
/* ===== yeni bölümler: afiş, zamanlama, istatistik, şube ===== */
.pmini{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#000}
.tile .th .pmini{position:absolute;inset:0;aspect-ratio:auto}
.tile .th.off{opacity:.45}
.tile .sch{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.75);border-radius:20px;padding:3px 9px;font-size:11px;max-width:calc(100% - 14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .hid{position:absolute;bottom:7px;right:7px;background:var(--bad,#c0392b);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 0 10px;overflow:hidden;cursor:pointer}
.pcard:hover{border-color:var(--accent2)}
.pcard b,.pcard span{padding:0 11px}
.ped{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.ped .fl{margin-bottom:10px}
.pv16{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-bottom:6px}
#modal .mb:has(.ped){max-width:980px;width:96vw;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;overflow:auto;align-items:stretch}
.stu-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;border:2px dashed var(--line2);border-radius:14px;cursor:pointer;text-align:center;padding:20px}
.stu-drop b{font-size:18px}.stu-drop:hover,.stu-drop.over{border-color:var(--accent2);background:rgba(var(--a2),.06)}
.stu-cv{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;display:block;margin-bottom:10px}
.stu-lays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stu-lay{display:flex;flex-direction:column;gap:4px;padding:4px;background:var(--panel2);border:2px solid var(--line);border-radius:10px;cursor:pointer;color:var(--soft);font-size:12px}
.stu-lay canvas{width:100%;aspect-ratio:16/9;border-radius:6px;display:block}.stu-lay.on{border-color:var(--accent2);color:var(--text)}
.pmini img{width:100%;height:100%;object-fit:cover;display:block}
.adst{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--panel3);color:var(--soft);vertical-align:3px;margin-left:6px}.adst.on{background:rgba(62,207,116,.16);color:var(--ok)}
.adg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.adc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.adc .th{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}.adc .th img,.adc .th video{width:100%;height:100%;object-fit:cover;display:block}
.adc .th .ty{position:absolute;left:6px;top:6px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:6px}
.adc .m{display:flex;gap:4px;align-items:center;padding:6px 8px}.adc .m span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.adc.add{align-items:center;justify-content:center;gap:4px;min-height:140px;border-style:dashed;cursor:pointer;color:var(--text);font:inherit;text-align:center;padding:10px}.adc.add:hover{border-color:var(--accent2)}
.adhow{margin:0 0 12px;padding-left:20px;display:grid;gap:8px}
.stu-hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.stu-hero p{flex:1;min-width:220px;margin:0}
.mtr{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px 14px;padding-left:10px;border-left:2px solid var(--line2)}
.mtr input{flex:1 1 180px;font-size:13px;padding:6px 9px}
.ckl{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--soft);cursor:pointer}
.ckl input{width:18px;height:18px;accent-color:var(--accent2)}
.stat b.dl{display:inline;font-size:12.5px;font-weight:700}.dl.up{color:#4ade80}.dl.dn{color:#f87171}.dlw{display:block;line-height:1.5}
.qst .mini{display:flex;align-items:flex-end;gap:2px;height:38px;width:34%;min-width:90px;flex:none}.qst .mini div{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}.qst .mini i{display:block;width:100%;background:var(--accent2);border-radius:2px 2px 0 0;min-height:2px}
.qst .big{font-size:24px;font-weight:700;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:38px repeat(24,1fr);gap:3px;align-items:center}.heat i{display:block;height:22px;border-radius:4px}.heat .hl{font-size:10.5px;color:var(--mute);text-align:center}.heat .dn{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:3px;height:180px;padding:6px 0;border-bottom:1px solid var(--line2);margin-bottom:6px}
.bars div{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--accent2);border-radius:3px 3px 0 0;min-height:2px}
.bars div:hover i{background:var(--text)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td:nth-child(n+3){font-variant-numeric:tabular-nums}
#brsw{padding:0 6px 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#brsw select{width:100%;font-size:13.5px;padding:8px 10px}
@media (max-width:760px){.ped{grid-template-columns:1fr}}
.langsel{background:var(--panel2,#242828);color:inherit;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;cursor:pointer;max-width:100%}
/* ===== müzik stüdyosu ===== */
.mrem{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:14px;background:linear-gradient(145deg,rgba(var(--a2),.16),rgba(255,255,255,.03));border:1px solid rgba(var(--a2),.38)}
.mrem-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mrem-cov{width:58px;height:58px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.mrem-cov img{width:100%;height:100%;object-fit:cover;display:block}
.mrem-info{flex:1;min-width:180px}
.mrem-info small{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:3px}
.mrem-info b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrem-info span{display:block;font-size:13px;color:var(--mute)}
.mrem-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mrem-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:#fff;font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.mrem-btn:hover{border-color:var(--accent2);background:var(--panel3)}
.mrem-btn.play{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-size:20px;box-shadow:0 6px 20px rgba(var(--a2),.35)}
.mrem-vol{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:8px 14px;border-radius:30px;border:1px solid var(--line);min-width:210px;flex:1;max-width:320px}
.mrem-vol input[type=range]{flex:1;accent-color:var(--accent2);cursor:pointer}
.mtag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.mtag.sp{background:rgba(29,185,84,.16);color:#1ed760;border:1px solid rgba(29,185,84,.35)}
.mtag.yt{background:rgba(255,50,70,.16);color:#ff6b7a;border:1px solid rgba(255,50,70,.35)}
.mtag.rd{background:rgba(var(--a2),.18);color:var(--accent2);border:1px solid rgba(var(--a2),.35)}
.mpreset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
