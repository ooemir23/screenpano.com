plugins {
    id 'com.android.application'
}

// Tek APK, tüm işletmeler. Sunucu adresi ve uygulama adı derlerken verilir:
//   ./gradlew assembleRelease -PBASE_URL=https://ekran.alanadiniz.com -PAPP_NAME="KafeTV"
def baseUrl = (project.findProperty('BASE_URL') ?: 'https://ekran.example.com').toString()
def appName = (project.findProperty('APP_NAME') ?: 'KafeTV').toString()

// Release imzası: android/keystore.properties (git'e eklemeyin)
//   storeFile=../release.jks  storePassword=...  keyAlias=tv  keyPassword=...
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.kafetv.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kafetv.tv'
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName '2.0'
        buildConfigField 'String', 'BASE_URL', "\"${baseUrl}\""
        resValue 'string', 'app_name', appName
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
