plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def baseUrl = (project.findProperty('BASE_URL') ?: 'https://screenpano.com').toString()
def appName = (project.findProperty('APP_NAME') ?: 'ScreenPano').toString()

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.screenpano.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.screenpano.tv'
        minSdk 21
        targetSdk 34
        versionCode 22
        versionName '3.1'
        buildConfigField 'String', 'BASE_URL', "\"${baseUrl}\""
        resValue 'string', 'app_name', appName
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    // ExoPlayer (AndroidX Media3)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // OkHttp (HTTP & WebSocket)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coil (Image & SVG loading)
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-svg:2.7.0'

    // QR Code generator
    implementation 'com.google.zxing:core:3.5.3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
