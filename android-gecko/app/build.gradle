plugins {
    id 'com.android.application'
}

// GeckoView deneme sürümü: motor APK'nın içinde (Mozilla Gecko 159), kutunun WebView sürümüne bağımlı değil.
// WebView'li asıl uygulama android/ klasöründe; bu ayrı paket (com.screenpano.tvgecko) yan yana kurulur.
def baseUrl = (project.findProperty('BASE_URL') ?: 'https://screenpano.com').toString()
def appName = (project.findProperty('APP_NAME') ?: 'ScreenPano Gecko').toString()

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.screenpano.tv'
    compileSdkVersion 'android-37.2'

    defaultConfig {
        applicationId 'com.screenpano.tvgecko'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '2.1-gecko'
        buildConfigField 'String', 'BASE_URL', "\"${baseUrl}\""
        resValue 'string', 'app_name', appName
        ndk { // TV kutuları ARM: ./gradlew assembleRelease -PABI=arm64-v8a ile tek mimari (daha küçük APK)
            if (project.hasProperty('ABI')) abiFilters project.property('ABI').toString()
            else abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }


    buildFeatures { buildConfig true; resValues true }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261102144711'
}
